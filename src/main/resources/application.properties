# ============================================
# APLICAÇÃO
# ============================================
spring.application.name=busafe

# ============================================
# PERFORMANCE - Inicialização Rápida
# ============================================
spring.main.banner-mode=off
spring.jmx.enabled=false

# ============================================
# SERVIDOR
# ============================================
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=50MB
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Compressão GZIP para respostas HTML/JSON
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# UPLOAD DE ARQUIVOS
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ============================================
# MONGODB - Otimizado
# ============================================
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.connection-pool.min-size=10
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.max-wait-time=2000

# ============================================
# THYMELEAF - Produção com Cache
# ============================================
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# LOG - Produção (apenas erros e warnings)
# ============================================
logging.level.root=WARN
logging.level.com.transcol=INFO
logging.level.org.springframework=WARN
logging.level.org.mongodb.driver=WARN