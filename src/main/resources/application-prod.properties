# ============================================
# APLICAÇÃO
# ============================================
spring.application.name=busafe

# ============================================
# PERFORMANCE - Máxima em Produção
# ============================================
spring.main.banner-mode=off
spring.jmx.enabled=false

# ============================================
# SERVIDOR - Alta Performance
# ============================================
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=50MB
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Compressão GZIP agressiva
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# UPLOAD DE ARQUIVOS
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# ============================================
# MONGODB - Pool de Produção
# ============================================
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.connection-pool.min-size=10
spring.data.mongodb.connection-pool.max-size=50
spring.data.mongodb.connection-pool.max-wait-time=2000

# ============================================
# THYMELEAF - Cache Agressivo
# ============================================
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================
# LOG - Apenas Erros em Produção
# ============================================
logging.level.root=ERROR
logging.level.com.transcol=INFO
logging.level.org.springframework=ERROR
logging.level.org.mongodb.driver=ERROR
logging.file.name=logs/busafe.log
logging.file.max-size=10MB
logging.file.max-history=7