<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe — Mapa</title>
  <link rel="icon" href="./Logos/busafe.ico">
  <meta name="theme-color" content="#11121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BuSafe">
  <link rel="apple-touch-icon" href="./Logos/Logo_3.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/Style.css">
  <script src="js/scripts.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
</head>
<body>

  <button id="hamburger-btn" aria-label="Abrir menu">
    <i class="bi bi-list"></i>
  </button>

  <div id="sidebar-overlay"></div>

  <nav id="sidebar">
    <!-- cabeçalho -->
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="Logos/Logo_3.png" alt="BuSafe">
      </div>
      <button id="toggle-btn" aria-label="Recolher menu">
        <i class="bi bi-chevron-double-left"></i>
      </button>
    </div>

    <!-- busca -->
    <div class="sidebar-search">
      <form class="search-form" onsubmit="return false;">
        <i class="bi bi-search"></i>
        <input type="search" id="linha" name="q" placeholder="Buscar linha... (ex: 506)">
      </form>
    </div>
    <div class="search-controls">
      <button id="go">Buscar</button>
      <button id="clear">Limpar</button>
    </div>
    <div id="status"></div>

    <!-- nav scrollável -->
    <div class="sidebar-nav">
      <div class="nav-label">Navegação</div>

      <li class="active" style="list-style:none;">
        <a href="index.html" class="nav-item">
          <i class="bi bi-map"></i>
          <span>Mapa</span>
        </a>
      </li>

      <a href="html/relatorio.html" class="nav-item">
        <i class="bi bi-file-earmark-bar-graph"></i>
        <span>Relatório</span>
        <span class="nav-badge">PRO</span>
      </a>

      <a href="html/planos.html" class="nav-item">
        <i class="bi bi-gem"></i>
        <span>Planos</span>
      </a>

      <a href="html/cadastro.html" class="nav-item">
        <i class="bi bi-person-plus"></i>
        <span>Cadastro</span>
      </a>

      <div class="nav-label">Linhas Frequentes</div>

      <button class="nav-item" onclick="toggleSubMenu(this)">
        <i class="bi bi-bus-front"></i>
        <span>Ver linhas</span>
        <i class="bi bi-chevron-down dropdown-arrow"></i>
      </button>
      <div class="sub-menu">
        <div>
          <a href="#" class="nav-item">505 — Terminal Jardim América</a>
          <a href="#" class="nav-item">591 — Campo Grande</a>
          <a href="#" class="nav-item">506 — Terminal Vila Velha</a>
          <a href="#" class="nav-item">515 — Bairro República</a>
        </div>
      </div>

      <div class="nav-label">Preferências</div>

      <a href="#" id="theme-btn" class="nav-item theme-toggle">
        <i class="bi bi-moon-stars" id="moon-icon"></i>
        <i class="bi bi-sun"        id="sun-icon"></i>
        <span>Alterar Tema</span>
      </a>
    </div>

    <!-- rodapé fixo: reportar -->
    <div class="sidebar-footer">
      <a href="html/alert.html" class="btn-report">
        <i class="bi bi-exclamation-triangle"></i>
        <span>Reportar Incidente</span>
        <div class="report-dot"></div>
      </a>
    </div>
  </nav>

  <main id="content">
    <div id="map"></div>
    <div id="map-legend">
      <div class="legend-title">Legenda</div>
      <div class="legend-item"><div class="legend-line" style="background:#812f9a;"></div> Rota</div>
      <div class="legend-item"><div class="legend-dot"  style="background:#1976d2;"></div> Sua posição</div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script>
    const GEOJSON_URL = "/rotas/geojson";
    const statusEl = document.getElementById('status');

    function showStatus(msg, ms = 2500) {
      statusEl.textContent = msg;
      statusEl.classList.add('show');
      if (ms) setTimeout(() => statusEl.classList.remove('show'), ms);
    }

    const base             = new ol.layer.Tile({ source: new ol.source.OSM() });
    const todasRotasSource = new ol.source.Vector({ url: GEOJSON_URL + "?v=" + Date.now(), format: new ol.format.GeoJSON() });

    const styleBySentido = feature => {
      const isVolta = /volta/i.test(String(feature.get('sentido') || ''));
      return new ol.style.Style({ stroke: new ol.style.Stroke({ color: isVolta ? '#d32f2f' : '#2e7d32', width: 3 }) });
    };

    const rotasLayer    = new ol.layer.Vector({ source: todasRotasSource, style: styleBySentido });
    const resultadoSource = new ol.source.Vector({ features: [] });
    const resultadoLayer  = new ol.layer.Vector({
      source: resultadoSource,
      style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 }) })
    });

    const relatoSource = new ol.source.Vector({ features: [] });
    const relatoLayer  = new ol.layer.Vector({ source: relatoSource });

    const busSource = new ol.source.Vector({ features: [] });
    const busLayer  = new ol.layer.Vector({ source: busSource });

    const userSource = new ol.source.Vector({ features: [] });
    const userLayer  = new ol.layer.Vector({ source: userSource });

    const map = new ol.Map({
      target: 'map',
      layers: [base, rotasLayer, resultadoLayer, relatoLayer, busLayer, userLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([-40.3128, -20.3155]),
        zoom: 12
      })
    });

    // --- Popup logic ---
    const popupEl = document.createElement('div');
    popupEl.className = 'ol-popup';
    document.body.appendChild(popupEl);

    const overlay = new ol.Overlay({
      element: popupEl,
      positioning: 'bottom-center',
      stopEvent: true,
      offset: [0, -15]
    });
    map.addOverlay(overlay);

    map.on('click', evt => {
      const feature = map.forEachFeatureAtPixel(evt.pixel, f => f);
      if (feature && feature.getProperties().featureType) {
        const props = feature.getProperties();
        const coord = feature.getGeometry().getCoordinates();

        let html = '';
        if (props.featureType === 'relato') {
          html = `
            <div class="popup-content">
              <h3>${props.tipo}</h3>
              <p>${props.descricao}</p>
              <small>${formatarData(props.dataRelato)}</small>
            </div>
          `;
        } else if (props.featureType === 'onibus') {
          html = `
            <div class="popup-content">
              <h3>Ônibus ${props.linha}</h3>
              <p>Monitoramento ativo</p>
            </div>
          `;
        }

        popupEl.innerHTML = html;
        overlay.setPosition(coord);
        popupEl.style.display = 'block';
      } else {
        popupEl.style.display = 'none';
      }
    });

    // --- Relatos & Incidentes ---
    const RELATOS_URL = "/relatos";
    const INCIDENTES_ATIVOS_URL = "/api/incidentes/ativos";

    let relatosCache = [];
    let incidentesAtivosCache = [];
    let linhaSelecionada = null;

    const INCIDENT_ICON_DEFS = {
      assalto: { color: '#e53935', viewBox: '0 0 16 16', path: 'M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z', label: 'Assalto' },
      furto: { color: '#fb8c00', viewBox: '0 0 16 16', path: 'M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z', label: 'Furto' },
      assedio: { color: '#d81b60', viewBox: '0 0 16 16', path: 'M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.288 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z', label: 'Assédio' },
      vandalismo: { color: '#7b1fa2', viewBox: '0 0 16 16', path: 'M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z', label: 'Vandalismo' },
      outro: { color: '#546e7a', viewBox: '0 0 16 16', path: 'M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z', label: 'Outro' },
      bus_monitorado: {
        color: '#0f766e',
        viewBox: '0 0 16 16',
        path: 'M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1v2zM3 11a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm8 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0z',
        label: 'Ônibus monitorado'
      }
    };

    const markerCache = new Map();
    const busMarkerCache = new Map();

    function svgToDataUrl(svg) {
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function createMarkerSvg(def, { highlight = false, isBus = false } = {}) {
      const size = highlight ? 112 : 104;
      const center = size / 2;

      const haloRadius = highlight ? 44 : 40;
      const haloOpacityStrong = highlight ? 0.72 : 0.60;
      const haloOpacityMid = highlight ? 0.32 : 0.24;

      const bubbleRadius = isBus ? 16 : 15;
      const iconSize = isBus ? 20 : 18;

      return `
        <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <defs>
            <radialGradient id="g" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="${def.color}" stop-opacity="${haloOpacityStrong}" />
              <stop offset="38%" stop-color="${def.color}" stop-opacity="${haloOpacityMid}" />
              <stop offset="72%" stop-color="${def.color}" stop-opacity="0.10" />
              <stop offset="100%" stop-color="${def.color}" stop-opacity="0" />
            </radialGradient>
          </defs>

          <circle cx="${center}" cy="${center}" r="${haloRadius}" fill="url(#g)" />

          <circle
            cx="${center}"
            cy="${center}"
            r="${bubbleRadius}"
            fill="${def.color}"
            stroke="#ffffff"
            stroke-width="3.2"
          />

          <svg
            x="${center - iconSize / 2}"
            y="${center - iconSize / 2}"
            width="${iconSize}"
            height="${iconSize}"
            viewBox="${def.viewBox}"
          >
            <path d="${def.path}" fill="#ffffff"/>
          </svg>
        </svg>
      `;
    }

    function getMarkerStyle(type, { highlight = false, isBus = false, rotation = 0 } = {}) {
      const def = INCIDENT_ICON_DEFS[type] || INCIDENT_ICON_DEFS.outro;
      const cacheKey = `${type}-${highlight}-${isBus}`;

      const cache = isBus ? busMarkerCache : markerCache;
      if (!cache.has(cacheKey)) {
        const svg = createMarkerSvg(def, { highlight, isBus });
        cache.set(cacheKey, svgToDataUrl(svg));
      }

      const markerSize = highlight ? 112 : 104;

      return new ol.style.Style({
        image: new ol.style.Icon({
          src: cache.get(cacheKey),
          imgSize: [markerSize, markerSize],
          anchor: [0.5, 0.5],
          rotateWithView: true,
          rotation
        }),
        zIndex: highlight ? 30 : (isBus ? 25 : 20)
      });
    }

    function formatarData(value) {
      if (!value) return 'Horário não informado';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function linhaDoRelato(relato) {
      return relato.linhaTranscol ?? relato.linhaMunicipal ?? null;
    }

    function isLinhaSelecionada(linha) {
      if (linhaSelecionada == null || linha == null) return false;
      return String(linhaSelecionada).trim() === String(linha).trim();
    }

    function renderRelatos() {
      relatoSource.clear();
      relatosCache.forEach(relato => {
        if (relato.latitude == null || relato.longitude == null) return;
        const linha = linhaDoRelato(relato);
        const highlight = isLinhaSelecionada(linha);
        const coord = ol.proj.fromLonLat([Number(relato.longitude), Number(relato.latitude)]);
        const feat = new ol.Feature(new ol.geom.Point(coord));
        feat.setProperties({ featureType: 'relato', ...relato, linha });
        feat.setStyle(getMarkerStyle(relato.tipo, { highlight }));
        relatoSource.addFeature(feat);
      });
    }

    function renderOnibusAtivos() {
      busSource.clear();
      incidentesAtivosCache.forEach(inc => {
        if (!inc?.coordenada || inc.linha == null) return;
        const coord = ol.proj.fromLonLat([inc.coordenada.lon, inc.coordenada.lat]);
        const highlight = isLinhaSelecionada(inc.linha);
        const feat = new ol.Feature(new ol.geom.Point(coord));
        feat.setProperties({ featureType: 'onibus', ...inc });
        feat.setStyle(getMarkerStyle('bus_monitorado', { highlight, isBus: true }));
        busSource.addFeature(feat);
      });
    }

    async function carregarRelatos() {
      try {
        const resp = await fetch(RELATOS_URL + '?v=' + Date.now());
        relatosCache = await resp.json();
        renderRelatos();
      } catch (err) { console.error(err); }
    }

    async function carregarIncidentesAtivos() {
      try {
        const resp = await fetch(INCIDENTES_ATIVOS_URL + '?v=' + Date.now());
        incidentesAtivosCache = await resp.json();
        renderOnibusAtivos();
      } catch (err) { console.error(err); }
    }

    document.getElementById('clear').onclick = () => {
      resultadoSource.clear();
      rotasLayer.setVisible(true);
      document.getElementById('linha').value = '';
      linhaSelecionada = null;
      renderRelatos();
      renderOnibusAtivos();
    };

    document.getElementById('go').onclick = async () => {
      const codigo = document.getElementById('linha').value.trim();
      if (!codigo) return;
      try {
        const resp = await fetch(`/api/rotas/buscar/${encodeURIComponent(codigo)}`);
        const json = await resp.json();
        if (json.features?.length) {
          const feats = new ol.format.GeoJSON().readFeatures(json, { featureProjection: 'EPSG:3857' });
          resultadoSource.clear();
          resultadoSource.addFeatures(feats);
          rotasLayer.setVisible(false);
          map.getView().fit(resultadoSource.getExtent(), { padding: [40, 40, 40, 40], maxZoom: 15 });
          linhaSelecionada = codigo;
          renderRelatos();
          renderOnibusAtivos();
        }
      } catch (err) { console.error(err); }
    };

    carregarRelatos();
    carregarIncidentesAtivos();
    setInterval(carregarIncidentesAtivos, 15000);
  </script>
</body>
</html>
