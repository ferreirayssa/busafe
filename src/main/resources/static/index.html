  <div id="toast-container"></div>

  <script>
    const GEOJSON_URL = "/rotas/geojson";
    const statusEl = document.getElementById('status');

    function showStatus(msg, ms = 2500) {
      statusEl.textContent = msg;
      statusEl.classList.add('show');
      if (ms) setTimeout(() => statusEl.classList.remove('show'), ms);
    }

    const base             = new ol.layer.Tile({ source: new ol.source.OSM() });
    const todasRotasSource = new ol.source.Vector({ url: GEOJSON_URL + "?v=" + Date.now(), format: new ol.format.GeoJSON() });

    const styleBySentido = feature => {
      const isVolta = /volta/i.test(String(feature.get('sentido') || ''));
      return new ol.style.Style({ stroke: new ol.style.Stroke({ color: isVolta ? '#d32f2f' : '#2e7d32', width: 3 }) });
    };

    const rotasLayer    = new ol.layer.Vector({ source: todasRotasSource, style: styleBySentido });
    const resultadoSource = new ol.source.Vector({ features: [] });
    const resultadoLayer  = new ol.layer.Vector({
      source: resultadoSource,
      style: new ol.style.Style({ stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 }) })
    });

    const map = new ol.Map({
      target: 'map',
      layers: [base, rotasLayer, resultadoLayer],
      view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 12 })
    });

    todasRotasSource.on('change', () => {
      if (todasRotasSource.getState() === 'loading') { showStatus('Carregando rotas…', 0); }
      else if (todasRotasSource.getState() === 'ready') {
        statusEl.classList.remove('show');
        map.getView().fit(todasRotasSource.getExtent(), { padding: [40,40,40,40], maxZoom: 15 });
      }
    });
    todasRotasSource.on('error', () => showStatus('Falha ao carregar rotas.', 5000));

    document.getElementById('clear').onclick = () => {
      resultadoSource.clear();
      rotasLayer.setVisible(true);
      document.getElementById('linha').value = '';
      showStatus('Resultado limpo.');
    };

    document.getElementById('go').onclick = async () => {
      const codigo = document.getElementById('linha').value.trim();
      if (!codigo) { showStatus('Informe o código da linha.'); return; }
      try {
        showStatus('Buscando linha ' + codigo + '…', 0);
        const resp = await fetch(`/api/rotas/buscar/${encodeURIComponent(codigo)}`);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const json = await resp.json();
        if (json.features?.length) {
          const feats = new ol.format.GeoJSON().readFeatures(json, { featureProjection: 'EPSG:3857' });
          resultadoSource.clear();
          resultadoSource.addFeatures(feats);
          rotasLayer.setVisible(false);
          statusEl.classList.remove('show');
          map.getView().fit(resultadoSource.getExtent(), { padding: [40,40,40,40], maxZoom: 15 });
          showStatus('Linha ' + codigo + ' exibida!');
        } else {
          resultadoSource.clear();
          rotasLayer.setVisible(true);
          showStatus('Nenhuma rota encontrada.', 3000);
        }
      } catch (err) {
        console.error(err);
        showStatus('Erro ao buscar linha.', 5000);
      }
    };

    document.getElementById('linha').addEventListener('keyup', e => {
      if (e.key === 'Enter') document.getElementById('go').click();
    });

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const c = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
        map.getView().animate({ center: c, zoom: 15, duration: 1000 });
        const f = new ol.Feature(new ol.geom.Point(c));
        f.setStyle(new ol.style.Style({ image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color: '#1976d2' }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) }) }));
        map.addLayer(new ol.layer.Vector({ source: new ol.source.Vector({ features: [f] }) }));
        showStatus('Localização encontrada!');
      }, err => { console.error(err); showStatus('Localização não encontrada.'); });
    }

    document.querySelectorAll('.sub-menu .nav-item').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('linha').value = link.textContent.trim().split('—')[0].trim();
        document.getElementById('go').click();
        closeAllSubMenus();
      });
    });

    /* ============================================================
       INCIDENTES ATIVOS — polling a cada 10s
       ============================================================ */
    const incidenteSource = new ol.source.Vector({ features: [] });
    const trilhaSource    = new ol.source.Vector({ features: [] });

    const INCIDENT_ICONS = {
      assalto:              { color: '#e53935', label: '!' },
      assedio:              { color: '#ff9800', label: '!' },
      violencia:            { color: '#9c27b0', label: '!' },
      furto:                { color: '#2196f3', label: '!' },
      onibus_parado_quebrado: { color: '#ef6c00', label: 'X' },
      outro:                { color: '#9e9e9e', label: '?' }
    };

    function criarEstiloIncidente(tipo) {
      const cfg = INCIDENT_ICONS[tipo] || INCIDENT_ICONS.outro;
      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: 10,
          fill: new ol.style.Fill({ color: cfg.color }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        }),
        text: new ol.style.Text({
          text: cfg.label,
          fill: new ol.style.Fill({ color: '#fff' }),
          font: 'bold 12px Poppins, sans-serif'
        })
      });
    }

    map.addLayer(new ol.layer.Vector({
      source: trilhaSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: 'rgba(229,57,53,0.5)', width: 3, lineDash: [6, 4] })
      })
    }));
    map.addLayer(new ol.layer.Vector({ source: incidenteSource }));

    // Popup overlay para info do incidente
    const popupEl = document.createElement('div');
    popupEl.id = 'incident-popup';
    popupEl.style.cssText = 'background:var(--base-clr,#11121a);color:var(--text-clr,#e6e6ef);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.4);pointer-events:auto;max-width:200px;';
    document.body.appendChild(popupEl);
    const popup = new ol.Overlay({ element: popupEl, positioning: 'bottom-center', offset: [0, -14], stopEvent: false });
    map.addOverlay(popup);
    popupEl.style.display = 'none';

    map.on('click', evt => {
      const feat = map.forEachFeatureAtPixel(evt.pixel, f => f, { layerFilter: l => l.getSource() === incidenteSource });
      if (feat) {
        const tipo = feat.get('tipo') || 'incidente';
        const linha = feat.get('linha') || '—';
        const mins = feat.get('minutosRestantes') || '?';
        popupEl.innerHTML = `<strong>${tipo.toUpperCase()}</strong><br>Linha: ${linha}<br>Expira em: ${mins} min`;
        popup.setPosition(evt.coordinate);
        popupEl.style.display = 'block';
      } else {
        popupEl.style.display = 'none';
      }
    });

    async function carregarIncidentesAtivos() {
      try {
        const resp = await fetch('/api/incidentes-ativos');
        if (!resp.ok) return;
        const incidentes = await resp.json();

        incidenteSource.clear();
        trilhaSource.clear();

        incidentes.forEach(inc => {
          const coord = inc.coordenada;
          if (!coord) return;

          // Icone do incidente na posicao atual
          const ponto = ol.proj.fromLonLat([coord.lon, coord.lat]);
          const feat = new ol.Feature(new ol.geom.Point(ponto));
          feat.setStyle(criarEstiloIncidente(inc.tipo));
          feat.set('tipo', inc.tipo);
          feat.set('linha', inc.linha);

          // Calcula minutos restantes
          if (inc.criadoEm) {
            const restante = Math.max(0, 30 - Math.floor((Date.now() - inc.criadoEm) / 60000));
            feat.set('minutosRestantes', restante);
          }

          incidenteSource.addFeature(feat);

          // Trilha percorrida
          if (inc.coordenadas && inc.coordenadas.length > 1) {
            const pontos = inc.coordenadas.map(c => ol.proj.fromLonLat([c.lon, c.lat]));
            const trilha = new ol.Feature(new ol.geom.LineString(pontos));
            trilhaSource.addFeature(trilha);
          }
        });
      } catch(e) { console.error('Erro ao carregar incidentes ativos:', e); }
    }

    // Polling a cada 10 segundos
    carregarIncidentesAtivos();
    setInterval(carregarIncidentesAtivos, 10000);
  </script>
</body>
</html>
