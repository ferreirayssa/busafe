  <script>
    const GEOJSON_URL = "/rotas/geojson";
    const RELATOS_URL = "/relatos";
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const legendCenterBtn = document.getElementById('legend-center-btn');
    const gpsCenterBtn = document.getElementById('gps-center-btn');
    const gpsEdgeIndicator = document.getElementById('gps-edge-indicator');
    const gpsEdgeArrow = document.getElementById('gps-edge-arrow');

    function showStatus(msg, ms = 2500) {
      statusEl.textContent = msg;
      statusEl.classList.add('show');
      if (ms) setTimeout(() => statusEl.classList.remove('show'), ms);
    }

    const base = new ol.layer.Tile({ source: new ol.source.OSM() });
    const todasRotasSource = new ol.source.Vector({
      url: GEOJSON_URL + "?v=" + Date.now(),
      format: new ol.format.GeoJSON()
    });

    const styleBySentido = feature => {
      const isVolta = /volta/i.test(String(feature.get('sentido') || ''));
      return new ol.style.Style({
        stroke: new ol.style.Stroke({ color: isVolta ? '#d32f2f' : '#2e7d32', width: 3 })
      });
    };

    const rotasLayer = new ol.layer.Vector({ source: todasRotasSource, style: styleBySentido });
    const resultadoSource = new ol.source.Vector({ features: [] });
    const resultadoLayer = new ol.layer.Vector({
      source: resultadoSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 })
      })
    });

    const map = new ol.Map({
      target: 'map',
      layers: [base, rotasLayer, resultadoLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([-40.307, -20.318]),
        zoom: 12
      })
    });

    todasRotasSource.on('change', () => {
      if (todasRotasSource.getState() === 'loading') {
        showStatus('Carregando rotas…', 0);
      } else if (todasRotasSource.getState() === 'ready') {
        statusEl.classList.remove('show');
        map.getView().fit(todasRotasSource.getExtent(), {
          padding: [40, 40, 40, 40],
          maxZoom: 15
        });
      }
    });

    todasRotasSource.on('error', () => showStatus('Falha ao carregar rotas.', 5000));

    document.getElementById('clear').onclick = () => {
      resultadoSource.clear();
      rotasLayer.setVisible(true);
      document.getElementById('linha').value = '';
      showStatus('Resultado limpo.');
    };

    document.getElementById('go').onclick = async () => {
      const codigo = document.getElementById('linha').value.trim();
      if (!codigo) {
        showStatus('Informe o código da linha.');
        return;
      }

      try {
        showStatus('Buscando linha ' + codigo + '…', 0);
        const resp = await fetch(`/api/rotas/buscar/${encodeURIComponent(codigo)}`);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const json = await resp.json();
        if (json.features?.length) {
          const feats = new ol.format.GeoJSON().readFeatures(json, {
            featureProjection: 'EPSG:3857'
          });

          resultadoSource.clear();
          resultadoSource.addFeatures(feats);
          rotasLayer.setVisible(false);
          statusEl.classList.remove('show');

          map.getView().fit(resultadoSource.getExtent(), {
            padding: [40, 40, 40, 40],
            maxZoom: 15
          });

          showStatus('Linha ' + codigo + ' exibida!');
        } else {
          resultadoSource.clear();
          rotasLayer.setVisible(true);
          showStatus('Nenhuma rota encontrada.', 3000);
        }
      } catch (err) {
        console.error(err);
        showStatus('Erro ao buscar linha.', 5000);
      }
    };

    document.getElementById('linha').addEventListener('keyup', e => {
      if (e.key === 'Enter') document.getElementById('go').click();
    });

    document.querySelectorAll('.sub-menu .nav-item').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        document.getElementById('linha').value = link.textContent.trim().split('—')[0].trim();
        document.getElementById('go').click();
        closeAllSubMenus();
      });
    });

    const INCIDENT_ICONS = {
      assalto: { color: '#e53935', label: 'Assalto' },
      assedio: { color: '#ff9800', label: 'Assédio' },
      violencia: { color: '#9c27b0', label: 'Violência' },
      furto: { color: '#2196f3', label: 'Furto' },
      onibus_parado_quebrado: { color: '#ef6c00', label: 'Ônibus parado/quebrado' },
      outro: { color: '#9e9e9e', label: 'Outro' }
    };

    const relatoSource = new ol.source.Vector({ features: [] });
    const userLocationSource = new ol.source.Vector({ features: [] });

    const relatoLayer = new ol.layer.Vector({ source: relatoSource });
    const userLocationLayer = new ol.layer.Vector({ source: userLocationSource });

    map.addLayer(relatoLayer);
    map.addLayer(userLocationLayer);

    const popupEl = document.createElement('div');
    popupEl.id = 'incident-popup';
    document.body.appendChild(popupEl);

    const popup = new ol.Overlay({
      element: popupEl,
      positioning: 'bottom-center',
      offset: [0, -18],
      stopEvent: false
    });

    map.addOverlay(popup);
    popupEl.style.display = 'none';

    let userFeature = null;
    let currentUserCoord = null;
    let firstLocationFix = true;
    let geoWatchId = null;

    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const bigint = parseInt(clean, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    const relatoIconCache = new Map();

    function createRelatoCanvas(color) {
      if (relatoIconCache.has(color)) return relatoIconCache.get(color);

      const size = 96;
      const center = size / 2;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(center, center, 8, center, center, 34);
      gradient.addColorStop(0, hexToRgba(color, 0.42));
      gradient.addColorStop(0.45, hexToRgba(color, 0.18));
      gradient.addColorStop(1, hexToRgba(color, 0));

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(center, center, 34, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.arc(center, center, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = '#ffffff';
      ctx.arc(center, center, 3, 0, Math.PI * 2);
      ctx.fill();

      relatoIconCache.set(color, canvas);
      return canvas;
    }

    function criarEstiloRelato(tipo) {
      const cfg = INCIDENT_ICONS[tipo] || INCIDENT_ICONS.outro;
      return new ol.style.Style({
        image: new ol.style.Icon({
          img: createRelatoCanvas(cfg.color),
          imgSize: [96, 96],
          anchor: [0.5, 0.5],
          anchorXUnits: 'fraction',
          anchorYUnits: 'fraction'
        })
      });
    }

    function criarEstiloUsuario() {
      return new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: '#1976d2' }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        })
      });
    }

    function formatarTipo(tipo) {
      return (INCIDENT_ICONS[tipo]?.label || 'Outro');
    }

    function formatarData(dataRelato) {
      if (!dataRelato) return 'Horário não informado';

      const dt = new Date(dataRelato);
      if (Number.isNaN(dt.getTime())) return dataRelato;

      return dt.toLocaleString('pt-BR', {
        dateStyle: 'short',
        timeStyle: 'short'
      });
    }

    function centerOnUser() {
      if (!currentUserCoord) {
        showStatus('Localização ainda não disponível.');
        return;
      }

      map.getView().animate({
        center: currentUserCoord,
        zoom: Math.max(map.getView().getZoom() || 15, 15),
        duration: 700
      });

      popupEl.style.display = 'none';
      updateGpsEdgeIndicator();
    }

    function getSafeBounds() {
      const rect = contentEl.getBoundingClientRect();
      const isMobile = window.innerWidth <= 768;
      const sidebarEl = document.getElementById('sidebar');
      const sidebarMobileOpen = isMobile && sidebarEl?.classList.contains('mobile-open');

      let safeLeft = isMobile ? 80 : 24;
      const safeTop = isMobile ? 80 : 24;
      const safeRight = rect.width - 24;
      const safeBottom = rect.height - 24;

      if (sidebarMobileOpen) {
        safeLeft = 280;
      }

      return { safeLeft, safeTop, safeRight, safeBottom };
    }

    function updateGpsEdgeIndicator() {
      if (!currentUserCoord) {
        gpsEdgeIndicator.classList.add('hidden');
        return;
      }

      const pixel = map.getPixelFromCoordinate(currentUserCoord);
      if (!pixel) {
        gpsEdgeIndicator.classList.add('hidden');
        return;
      }

      const [px, py] = pixel;
      const { safeLeft, safeTop, safeRight, safeBottom } = getSafeBounds();

      const isInside =
        px >= safeLeft &&
        px <= safeRight &&
        py >= safeTop &&
        py <= safeBottom;

      if (isInside) {
        gpsEdgeIndicator.classList.add('hidden');
        return;
      }

      const clampedX = Math.min(safeRight, Math.max(safeLeft, px));
      const clampedY = Math.min(safeBottom, Math.max(safeTop, py));

      const deltaX = px - clampedX;
      const deltaY = py - clampedY;
      const angle = (Math.atan2(deltaY, deltaX) * 180 / Math.PI) + 90;

      gpsEdgeIndicator.style.left = `${clampedX}px`;
      gpsEdgeIndicator.style.top = `${clampedY}px`;
      gpsEdgeIndicator.style.transform = 'translate(-50%, -50%)';
      gpsEdgeArrow.style.transform = `rotate(${angle}deg)`;

      gpsEdgeIndicator.classList.remove('hidden');
    }

    function atualizarUsuarioNoMapa(longitude, latitude) {
      currentUserCoord = ol.proj.fromLonLat([longitude, latitude]);

      if (!userFeature) {
        userFeature = new ol.Feature(new ol.geom.Point(currentUserCoord));
        userFeature.setStyle(criarEstiloUsuario());
        userLocationSource.addFeature(userFeature);
      } else {
        userFeature.setGeometry(new ol.geom.Point(currentUserCoord));
      }

      if (firstLocationFix) {
        map.getView().animate({
          center: currentUserCoord,
          zoom: 15,
          duration: 900
        });
        firstLocationFix = false;
        showStatus('Localização encontrada!');
      }

      updateGpsEdgeIndicator();
    }

    async function carregarRelatos() {
      try {
        const resp = await fetch(RELATOS_URL + '?v=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const relatos = await resp.json();
        relatoSource.clear();

        relatos.forEach(relato => {
          if (relato.latitude == null || relato.longitude == null) return;

          const coord = ol.proj.fromLonLat([
            Number(relato.longitude),
            Number(relato.latitude)
          ]);

          const feat = new ol.Feature(new ol.geom.Point(coord));
          feat.setStyle(criarEstiloRelato(relato.tipo));

          feat.setProperties({
            isRelato: true,
            id: relato.id,
            tipo: relato.tipo,
            descricao: relato.descricao,
            dataRelato: relato.dataRelato,
            bairro: relato.bairro,
            municipio: relato.municipio,
            linhaMunicipal: relato.linhaMunicipal,
            linhaTranscol: relato.linhaTranscol
          });

          relatoSource.addFeature(feat);
        });
      } catch (e) {
        console.error('Erro ao carregar relatos:', e);
        showStatus('Erro ao carregar relatos.', 4000);
      }
    }

    map.on('click', evt => {
      const feat = map.forEachFeatureAtPixel(evt.pixel, f => f, {
        layerFilter: layer => layer === relatoLayer
      });

      if (!feat) {
        popupEl.style.display = 'none';
        return;
      }

      const tipo = formatarTipo(feat.get('tipo'));
      const descricao = feat.get('descricao') || 'Sem observações';
      const dataRelato = formatarData(feat.get('dataRelato'));
      const bairro = feat.get('bairro') || '—';
      const municipio = feat.get('municipio') || '—';
      const linha = feat.get('linhaTranscol') ?? feat.get('linhaMunicipal');

      popupEl.innerHTML = `
        <span class="popup-title">${tipo}</span>
        <div><strong>Horário:</strong> ${dataRelato}</div>
        <div><strong>Bairro:</strong> ${bairro}</div>
        <div><strong>Município:</strong> ${municipio}</div>
        ${linha != null ? `<div><strong>Linha:</strong> ${linha}</div>` : ''}
        <div class="popup-desc"><strong>Observações:</strong> ${descricao}</div>
      `;

      popup.setPosition(evt.coordinate);
      popupEl.style.display = 'block';
    });

    if (navigator.geolocation) {
      geoWatchId = navigator.geolocation.watchPosition(
        pos => {
          atualizarUsuarioNoMapa(pos.coords.longitude, pos.coords.latitude);
        },
        err => {
          console.error(err);
          showStatus('Localização não encontrada.', 3500);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 10000
        }
      );
    } else {
      showStatus('Geolocalização não suportada pelo navegador.', 4000);
    }

    gpsCenterBtn?.addEventListener('click', centerOnUser);
    legendCenterBtn?.addEventListener('click', centerOnUser);
    gpsEdgeIndicator?.addEventListener('click', centerOnUser);

    map.on('moveend', updateGpsEdgeIndicator);
    window.addEventListener('resize', () => setTimeout(updateGpsEdgeIndicator, 80));
    document.getElementById('toggle-btn')?.addEventListener('click', () => setTimeout(updateGpsEdgeIndicator, 320));
    document.getElementById('hamburger-btn')?.addEventListener('click', () => setTimeout(updateGpsEdgeIndicator, 320));
    document.getElementById('sidebar-overlay')?.addEventListener('click', () => setTimeout(updateGpsEdgeIndicator, 320));

    carregarRelatos();
    setInterval(carregarRelatos, 15000);
  </script>
  
</body>
</html>
