<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - Cadastro</title>
  <link rel="icon" type="icon" href="../Logos/busafe.ico">
  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(8px);
      opacity: 0.3;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1;
    }

    .cadastro-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cadastro-container {
      width: 100%;
      padding: 2.5rem;
      background: linear-gradient(180deg, rgba(17, 18, 26, 0.95), rgba(17, 18, 26, 0.98));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.8);
      backdrop-filter: blur(20px);
    }

    body.light-mode .cadastro-container {
      background: linear-gradient(180deg, rgba(240, 242, 245, 0.95), rgba(240, 242, 245, 0.98));
    }

    .cadastro-container h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text-clr);
    }

    .cadastro-container p {
      text-align: center;
      color: var(--secondary-text-clr);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-clr);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.25);
      color: var(--text-clr);
      font-family: Poppins, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-clr);
      box-shadow: 0 0 0 3px rgba(16, 101, 156, 0.1);
    }

    .form-group input.error {
      border-color: #ef5350;
    }

    .error-message {
      color: #ef5350;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .cadastro-btn {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgb(11, 67, 105);
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .cadastro-btn:hover {
      background: linear-gradient(90deg, #10659c, #1375b7);
      box-shadow: 0 6px 18px rgb(11, 67, 105);
      transform: translateY(-2px) scale(1.02);
    }

    .cadastro-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 4px 10px rgb(11, 67, 105);
    }

    .cadastro-btn:disabled {
      background: rgba(16, 101, 156, 0.5);
      cursor: not-allowed;
      transform: none;
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--secondary-text-clr);
    }

    .login-link a {
      color: var(--accent-clr);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .login-link a:hover {
      color: #1375b7;
      text-decoration: underline;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4caf50;
      color: #4caf50;
      padding: 1rem;
      border-radius: 0.6rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-clr);
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      transition: background 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
    }

    .back-btn:hover {
      background: var(--hover-clr);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-clr);
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="overlay"></div>
  
  <div class="cadastro-wrapper">
    <a href="../index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m313-440 196 196q12 12 11.5 28T508-188q-12 11-28 11.5T452-188L188-452q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l264-264q11-11 27.5-11t28.5 11q12 12 12 28.5T508-715L313-520h447q17 0 28.5 11.5T800-480q0 17-11.5 28.5T760-440H313Z"/>
      </svg>
      Voltar
    </a>

    <div class="cadastro-container">
      <h1>Criar Conta</h1>
      <p>Preencha os dados abaixo para se cadastrar</p>

      <div class="success-message" id="successMessage">
        Cadastro realizado com sucesso! Redirecionando para o login...
      </div>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
          <div class="error-message" id="emailError">Por favor, insira um e-mail válido.</div>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
          <div class="error-message" id="cpfError">CPF inválido. Por favor, verifique.</div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" minlength="6" required>
          <div class="error-message" id="passwordError">A senha deve ter no mínimo 6 caracteres.</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
          <div class="error-message" id="confirmPasswordError">As senhas não coincidem.</div>
        </div>

        <button type="submit" class="cadastro-btn">Cadastrar</button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login aqui</a>
      </div>
    </div>
  </div>

  <script>
    // Inicializar mapa de fundo
    const base = new ol.layer.Tile({ source: new ol.source.OSM() });
    const map = new ol.Map({
      target: 'map',
      layers: [base],
      view: new ol.View({ 
        center: ol.proj.fromLonLat([-40.307, -20.318]), 
        zoom: 12 
      }),
      controls: []
    });

    // Função para validar CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]/g, '');
      
      if (cpf.length !== 11) return false;
      
      // Verifica se todos os dígitos são iguais
      if (/^(\d)\1{10}$/.test(cpf)) return false;
      
      // Validação do primeiro dígito verificador
      let soma = 0;
      for (let i = 0; i < 9; i++) {
        soma += parseInt(cpf.charAt(i)) * (10 - i);
      }
      let resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.charAt(9))) return false;
      
      // Validação do segundo dígito verificador
      soma = 0;
      for (let i = 0; i < 10; i++) {
        soma += parseInt(cpf.charAt(i)) * (11 - i);
      }
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.charAt(10))) return false;
      
      return true;
    }

    // Função para formatar CPF
    function formatarCPF(value) {
      value = value.replace(/\D/g, '');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      return value;
    }

    // Aplicar máscara ao CPF
    const cpfInput = document.getElementById('cpf');
    cpfInput.addEventListener('input', function(e) {
      e.target.value = formatarCPF(e.target.value);
    });

    // Validação em tempo real do CPF
    cpfInput.addEventListener('blur', function() {
      const cpfError = document.getElementById('cpfError');
      if (this.value && !validarCPF(this.value)) {
        this.classList.add('error');
        cpfError.classList.add('show');
      } else {
        this.classList.remove('error');
        cpfError.classList.remove('show');
      }
    });

    // Validação de confirmação de senha
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    
    confirmPasswordInput.addEventListener('blur', function() {
      const confirmPasswordError = document.getElementById('confirmPasswordError');
      if (this.value && this.value !== passwordInput.value) {
        this.classList.add('error');
        confirmPasswordError.classList.add('show');
      } else {
        this.classList.remove('error');
        confirmPasswordError.classList.remove('show');
      }
    });

    // Submissão do formulário
    document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const cpf = document.getElementById('cpf').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validações
      let hasError = false;
      
      if (!validarCPF(cpf)) {
        document.getElementById('cpf').classList.add('error');
        document.getElementById('cpfError').classList.add('show');
        hasError = true;
      }
      
      if (password.length < 6) {
        document.getElementById('password').classList.add('error');
        document.getElementById('passwordError').classList.add('show');
        hasError = true;
      }
      
      if (password !== confirmPassword) {
        document.getElementById('confirmPassword').classList.add('error');
        document.getElementById('confirmPasswordError').classList.add('show');
        hasError = true;
      }
      
      if (hasError) return;
      
      // Preparar dados para envio
      const cpfLimpo = cpf.replace(/[^\d]/g, '');
      const dados = {
        email: email,
        cpf: cpfLimpo,
        password: password
      };
      
      try {
        const response = await fetch('/auth/register/user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        });
        
        if (response.ok) {
          document.getElementById('successMessage').classList.add('show');
          document.getElementById('cadastroForm').reset();
          
          // Redirecionar para login após 2 segundos
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          const errorText = await response.text();
          alert('Erro ao cadastrar: ' + errorText);
        }
      } catch (error) {
        console.error('Erro:', error);
        alert('Erro ao processar cadastro. Tente novamente.');
      }
    });
  </script>
</body>
</html>
