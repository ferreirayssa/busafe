<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - Cadastro</title>
  <link rel="icon" type="image/x-icon" href="../Logos/busafe.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
  <style>
    :root {
      --text-clr: #333333;
      --secondary-text-clr: #666666;
      --accent-clr: #10659c;
      --hover-clr: rgba(0, 0, 0, 0.05);
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: url('../prototipo/osm.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Poppins, 'Segoe UI', sans-serif;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .cadastro-wrapper {
      position: relative; 
      z-index: 2;
      width: 100%;
      max-width: 480px; 
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cadastro-container {
      width: 100%;
      padding: 2rem; 
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.98));
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(20px);
      box-sizing: border-box;
    }

    .cadastro-container h1 {
      text-align: center;
      font-size: 1.8rem; 
      margin: 0 0 0.5rem 0;
      color: var(--text-clr);
    }

    .cadastro-container p {
      text-align: center;
      color: var(--secondary-text-clr);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text-clr);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-clr);
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    #phone {
      padding-left: 50px;
    }

    .phone-input-container {
      position: relative;
      width: 100%;
    }

    /* Prefixo +55 fixo */
    .phone-prefix {
      position: absolute;
      left: 15px; /* Posicionado após a bandeira */
      top: 48%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: var(--secondary-text-clr);
      font-weight: 500;
      pointer-events: none; /* Não interfere no clique do input */
    }
    /* ------------------------------------------- */

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-clr);
      box-shadow: 0 0 0 3px rgba(16, 101, 156, 0.1);
    }

    .error-message {
      color: #ef5350;
      font-size: 0.8rem;
      margin-top: 0.2rem;
      display: none;
    }

    .error-message.show { display: block; }

    .cadastro-btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(16, 101, 156, 0.3);
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .cadastro-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #1375b7, #1585cf);
      box-shadow: 0 6px 18px rgba(16, 101, 156, 0.4);
    }

    .login-link {
      text-align: center;
      margin-top: 1.2rem;
      color: var(--secondary-text-clr);
      font-size: 0.9rem;
    }

    .login-link a {
      color: var(--accent-clr);
      text-decoration: none;
      font-weight: 600;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4caf50;
      color: #4caf50;
      padding: 0.8rem;
      border-radius: 0.6rem;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
      font-size: 0.9rem;
    }

    .success-message.show { display: block; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 0.6rem;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      align-self: flex-start; 
    }

    .logo-container { text-align: center; margin-bottom: 1rem; }
    .logo-container img { max-width: 100px; }

  </style>
</head>

<body>
  <div id="map"></div>
  <div class="overlay"></div>
  
  <div class="cadastro-wrapper">
    <a href="../index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m313-440 196 196q12 12 11.5 28T508-188q-12 11-28 11.5T452-188L188-452q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l264-264q11-11 27.5-11t28.5 11q12 12 12 28.5T508-715L313-520h447q17 0 28.5 11.5T800-480q0 17-11.5 28.5T760-440H313Z"/>
      </svg>
      Voltar
    </a>

    <div class="cadastro-container">
      <div class="logo-container">
        <img src="../Logos/Logo_3.png" alt="BuSafe Logo">
      </div>
      <h1>Criar Conta</h1>
      <p>Preencha os dados abaixo para se cadastrar</p>

      <div class="success-message" id="successMessage">
        Cadastro realizado com sucesso!
      </div>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
          <div class="error-message" id="emailError">E-mail inválido.</div>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
          <div class="error-message" id="cpfError">CPF inválido.</div>
        </div>

        <div class="form-group">
          <label for="phone">Telefone</label>
          <div class="phone-input-container">
            <span class="phone-prefix">+55</span>
            <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000" maxlength="15" required>
          </div>
          <div class="error-message" id="phoneError">Número de telefone inválido.</div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" minlength="6" required>
          <div class="error-message" id="passwordError">Mínimo 6 caracteres.</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
          <div class="error-message" id="confirmPasswordError">As senhas não coincidem.</div>
        </div>

        <button type="submit" class="cadastro-btn">Cadastrar</button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login aqui</a>
      </div>
    </div>
  </div>

  <script>
    // --- MAPA ---
    const map = new ol.Map({
      target: 'map',
      layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
      view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 12 }),
      controls: []
    });

    // --- MÁSCARA E VALIDAÇÃO SIMPLES DO TELEFONE BRASILEIRO ---
    const phoneInput = document.getElementById('phone');

    function formatarTelefone(value) {
      // Remove tudo que não for dígito
      value = value.replace(/\D/g, '');
      
      if (value.length > 11) value = value.slice(0, 11); // Limita a 11 dígitos

      // Aplica a máscara (00) 00000-0000
      if (value.length > 6) {
        return value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
      } else if (value.length > 2) {
        return value.replace(/^(\d{2})(\d{0,5}).*/, '($1) $2');
      } else {
        return value.replace(/^(\d*).*/, '($1');
      }
    }

    phoneInput.addEventListener('input', (e) => {
      e.target.value = formatarTelefone(e.target.value);
    });

    function validarTelefone(phone) {
      const soNumeros = phone.replace(/\D/g, '');
      // Validação básica: checa se tem 10 (fixo) ou 11 (celular) dígitos
      return soNumeros.length >= 10 && soNumeros.length <= 11;
    }
    // ---------------------------------------------------------

    // --- VALIDAÇÃO CPF ---
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto < 2) resto = 0; else resto = 11 - resto;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if (resto < 2) resto = 0; else resto = 11 - resto;
      if (resto !== parseInt(cpf.substring(10, 11))) return false;
      return true;
    }

    function formatarCPF(value) {
      return value.replace(/\D/g, '').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }

    document.getElementById('cpf').addEventListener('input', (e) => { e.target.value = formatarCPF(e.target.value); });

  // --- SUBMISSÃO DO FORMULÁRIO ---
      document.getElementById('cadastroForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const cpf = document.getElementById('cpf').value;
        const phone = document.getElementById('phone').value;
        const pass = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const email = document.getElementById('email').value; // Pegando o email
        
        let hasError = false;

        // Valida Telefone
        if (!validarTelefone(phone)) {
          document.getElementById('phoneError').classList.add('show');
          hasError = true;
        } else {
          document.getElementById('phoneError').classList.remove('show');
        }

        // Valida CPF
        if (!validarCPF(cpf)) {
          document.getElementById('cpfError').classList.add('show');
          hasError = true;
        } else {
          document.getElementById('cpfError').classList.remove('show');
        }

        // Valida Senhas
        if (pass !== confirm) {
          document.getElementById('confirmPasswordError').classList.add('show');
          hasError = true;
        } else {
          document.getElementById('confirmPasswordError').classList.remove('show');
        }

        if (hasError) return;

        // --- SUCESSO E PERSISTÊNCIA ---
        
        // 1. Criamos o objeto com os dados
        const dadosParaEnvio = {
          email: email,
          cpf: cpf.replace(/\D/g, ''),
          telefone: '+55' + phone.replace(/\D/g, ''), 
          senha: pass
        };

        // 2. SALVAMOS NO LOCALSTORAGE
        // Transformamos o objeto em String (JSON.stringify) porque o storage só aceita texto
        localStorage.setItem('usuarioCadastrado', JSON.stringify(dadosParaEnvio));

        // 3. Feedback visual para o usuário
        document.getElementById('successMessage').classList.add('show');
        console.log("Dados persistidos no navegador:", dadosParaEnvio);

        // 4. Opcional: Redirecionar para o login após um tempinho
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      });
  </script>
</body>
</html>
