<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - Cadastro</title>
  <link rel="icon" type="image/x-icon" href="../Logos/busafe.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
  <style>
    :root {
      /* Variáveis ajustadas para o modo claro no container */
      --text-clr: #333333; /* Texto principal escuro */
      --secondary-text-clr: #666666; /* Texto secundário escuro */
      --accent-clr: #10659c;
      --hover-clr: rgba(0, 0, 0, 0.05); /* Hover escurecido para fundos claros */
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center; /* Centraliza verticalmente */
      justify-content: center; /* Centraliza horizontalmente */
      position: relative;
      background-color: #0f1016; /* Cor de fundo de segurança */
      font-family: Poppins, 'Segoe UI', sans-serif;
    }

    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(4px);
      opacity: 0.4;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .cadastro-wrapper {
      position: relative; 
      z-index: 2;
      width: 100%;
      max-width: 480px; 
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container alterado para modo branco */
    .cadastro-container {
      width: 100%;
      padding: 2rem; 
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.98));
      border: 1px solid rgba(0, 0, 0, 0.1); /* Borda sutil escura */
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); /* Sombra mais leve */
      backdrop-filter: blur(20px);
      box-sizing: border-box;
    }

    .cadastro-container h1 {
      text-align: center;
      font-size: 1.8rem; 
      margin: 0 0 0.5rem 0;
      color: var(--text-clr);
    }

    .cadastro-container p {
      text-align: center;
      color: var(--secondary-text-clr);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      color: var(--text-clr);
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Inputs alterados para combinar com o fundo branco */
    .form-group input {
      width: 100%;
      padding: 0.7rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-clr);
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-clr);
      box-shadow: 0 0 0 3px rgba(16, 101, 156, 0.1);
    }

    .form-group input.error {
      border-color: #ef5350;
    }

    .error-message {
      color: #ef5350;
      font-size: 0.8rem;
      margin-top: 0.2rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* Botão atualizado seguindo o padrão da tela de login */
    .cadastro-btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(16, 101, 156, 0.3);
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .cadastro-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #1375b7, #1585cf);
      box-shadow: 0 6px 18px rgba(16, 101, 156, 0.4);
    }

    .login-link {
      text-align: center;
      margin-top: 1.2rem;
      color: var(--secondary-text-clr);
      font-size: 0.9rem;
    }

    .login-link a {
      color: var(--accent-clr);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .login-link a:hover {
      color: #1585cf;
      text-decoration: underline;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4caf50;
      color: #4caf50;
      padding: 0.8rem;
      border-radius: 0.6rem;
      margin-bottom: 1rem;
      display: none;
      text-align: center;
      font-size: 0.9rem;
    }

    .success-message.show {
      display: block;
    }

    /* Botão de voltar isolado na cor branca para não sumir no mapa */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.4rem 0.8rem;
      border-radius: 0.6rem;
      transition: background 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      font-size: 0.9rem;
      align-self: flex-start; 
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="overlay"></div>
  
  <div class="cadastro-wrapper">
    <a href="../index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m313-440 196 196q12 12 11.5 28T508-188q-12 11-28 11.5T452-188L188-452q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l264-264q11-11 27.5-11t28.5 11q12 12 12 28.5T508-715L313-520h447q17 0 28.5 11.5T800-480q0 17-11.5 28.5T760-440H313Z"/>
      </svg>
      Voltar
    </a>

    <div class="cadastro-container">
      <h1>Criar Conta</h1>
      <p>Preencha os dados abaixo para se cadastrar</p>

      <div class="success-message" id="successMessage">
        Cadastro realizado com sucesso!
      </div>

      <form id="cadastroForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
          <div class="error-message" id="emailError">E-mail inválido.</div>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
          <div class="error-message" id="cpfError">CPF inválido.</div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" minlength="6" required>
          <div class="error-message" id="passwordError">Mínimo 6 caracteres.</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
          <div class="error-message" id="confirmPasswordError">As senhas não coincidem.</div>
        </div>

        <button type="submit" class="cadastro-btn">Cadastrar</button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login.html">Faça login aqui</a>
      </div>
    </div>
  </div>

  <script>
    // Configuração do Mapa OpenLayers
    const base = new ol.layer.Tile({ source: new ol.source.OSM() });
    const map = new ol.Map({
      target: 'map',
      layers: [base],
      view: new ol.View({ 
        center: ol.proj.fromLonLat([-40.307, -20.318]), // Coordenadas de exemplo (Vitória)
        zoom: 12 
      }),
      controls: [] // Remove controles de zoom para limpar o visual
    });

    // --- LÓGICA DE VALIDAÇÃO ---
    
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      
      let soma = 0, resto;
      for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
      resto = (soma * 10) % 11;
      if ((resto === 10) || (resto === 11)) resto = 0;
      if (resto !== parseInt(cpf.substring(9, 10))) return false;
      
      soma = 0;
      for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
      resto = (soma * 10) % 11;
      if ((resto === 10) || (resto === 11)) resto = 0;
      if (resto !== parseInt(cpf.substring(10, 11))) return false;
      
      return true;
    }

    function formatarCPF(value) {
      return value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }

    const cpfInput = document.getElementById('cpf');
    cpfInput.addEventListener('input', (e) => {
      e.target.value = formatarCPF(e.target.value);
    });

    cpfInput.addEventListener('blur', function() {
      const errorDiv = document.getElementById('cpfError');
      if (this.value && !validarCPF(this.value)) {
        this.classList.add('error');
        errorDiv.classList.add('show');
      } else {
        this.classList.remove('error');
        errorDiv.classList.remove('show');
      }
    });

    document.getElementById('cadastroForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Validação simplificada para o exemplo
      const cpf = document.getElementById('cpf').value;
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      
      if (!validarCPF(cpf) || pass.length < 6 || pass !== confirm) {
        alert("Por favor, corrija os erros no formulário.");
        return;
      }

      // Simulação de sucesso
      document.getElementById('successMessage').classList.add('show');
      
      // Aqui entraria sua chamada fetch para o backend Java
      console.log("Enviando dados para /auth/register/user...");
      
      setTimeout(() => {
        // window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
