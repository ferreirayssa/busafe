<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - Login</title>
  <link rel="icon" type="image/x-icon" href="../Logos/busafe.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
  <style>
    /* Variáveis ajustadas para o modo claro no container */
    :root {
      --text-clr: #333333; /* Texto principal escuro */
      --secondary-text-clr: #666666; /* Texto secundário escuro */
      --accent-clr: #10659c;
      --hover-clr: rgba(0, 0, 0, 0.05); /* Hover escurecido para fundos claros */
      --bg-dark: #0f1016;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: var(--bg-dark);
      background: url('../prototipo/osm.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Poppins, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-y: auto;
    }

    /* #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(4px);
      opacity: 0.4;
      pointer-events: none;
    } */

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1;
      pointer-events: none;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container alterado para modo branco */
    .login-container {
      width: 100%;
      padding: 2rem 2.5rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.98));
      border: 1px solid rgba(0, 0, 0, 0.1); /* Borda sutil escura */
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); /* Sombra mais leve */
      backdrop-filter: blur(20px);
      box-sizing: border-box;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo-container img {
      max-width: 100px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1)); /* Sombra da logo suavizada */
    }

    .login-container h1 {
      text-align: center;
      font-size: 1.8rem;
      margin: 0.5rem 0;
      color: var(--text-clr);
    }

    .login-container p {
      text-align: center;
      color: var(--secondary-text-clr);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-clr);
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Inputs alterados para combinar com o fundo branco */
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.8);
      color: var(--text-clr);
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-clr);
      box-shadow: 0 0 0 3px rgba(16, 101, 156, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(16, 101, 156, 0.3); /* Sombra ajustada */
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #1375b7, #1585cf);
      box-shadow: 0 6px 18px rgba(16, 101, 156, 0.4);
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .cadastro-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--secondary-text-clr);
      font-size: 0.9rem;
    }

    .cadastro-link a {
      color: var(--accent-clr);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .cadastro-link a:hover {
      color: #1585cf;
      text-decoration: underline;
    }

    .error-message {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid #ef5350;
      color: #ef5350;
      padding: 0.8rem;
      border-radius: 0.6rem;
      margin-bottom: 1.2rem;
      display: none;
      text-align: center;
      font-size: 0.9rem;
    }

    .error-message.show {
      display: block;
    }

    /* Botão de voltar mantido com cores claras para contrastar com o fundo escuro do mapa */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff; 
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      transition: background 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      align-self: flex-start;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="overlay"></div>
  
  <div class="login-wrapper">
    <a href="../html/cadastro.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m313-440 196 196q12 12 11.5 28T508-188q-12 11-28 11.5T452-188L188-452q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l264-264q11-11 27.5-11t28.5 11q12 12 12 28.5T508-715L313-520h447q17 0 28.5 11.5T800-480q0 17-11.5 28.5T760-440H313Z"/>
      </svg>
      Voltar
    </a>

    <div class="login-container">
      <div class="logo-container">
        <img src="../Logos/Logo_3.png" alt="BuSafe Logo">
      </div>

      <h1>Entrar</h1>
      <p>Acesse sua conta BuSafe</p>

      <div class="error-message" id="errorMessage">
        CPF ou senha incorretos. Tente novamente.
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
      </form>

      <div class="cadastro-link">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
      </div>
    </div>
  </div>

  <script>
    // Inicializar mapa de fundo (Sem controles e interações)
    const base = new ol.layer.Tile({ source: new ol.source.OSM() });
    const map = new ol.Map({
      target: 'map',
      layers: [base],
      view: new ol.View({ 
        center: ol.proj.fromLonLat([-40.307, -20.318]), // Coordenadas Vitória/ES
        zoom: 12 
      }),
      controls: [],
      interactions: [] // Mapa estático
    });

    // Função para formatar CPF em tempo real
    function formatarCPF(value) {
      return value
        .replace(/\D/g, '')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d)/, '$1.$2')
        .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    }

    const cpfInput = document.getElementById('cpf');
    cpfInput.addEventListener('input', function(e) {
      e.target.value = formatarCPF(e.target.value);
    });

    // Lógica de Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const cpfField = document.getElementById('cpf');
      const passwordField = document.getElementById('password');
      const errorMessage = document.getElementById('errorMessage');
      const btn = document.querySelector('.login-btn');

      // Feedback visual de carregamento
      const originalBtnText = btn.innerText;
      btn.innerText = 'Entrando...';
      btn.disabled = true;
      errorMessage.classList.remove('show');
      
      // Limpar formatação para envio
      const cpfLimpo = cpfField.value.replace(/[^\d]/g, '');
      
      const dados = {
        login: cpfLimpo,
        password: passwordField.value
      };
      
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        });
        
        if (response.ok) {
          const data = await response.json();
          
          // Salva o token JWT
          localStorage.setItem('token', data.token);
          
          // Redireciona
          window.location.href = '../index.html';
        } else {
          // Erro de autenticação (401, 403, etc)
          errorMessage.textContent = 'Credenciais inválidas. Verifique seu CPF e senha.';
          errorMessage.classList.add('show');
        }
      } catch (error) {
        console.error('Erro de conexão:', error);
        errorMessage.textContent = 'Erro de conexão com o servidor.';
        errorMessage.classList.add('show');
      } finally {
        // Restaura o botão
        btn.innerText = originalBtnText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
