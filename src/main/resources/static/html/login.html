<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - Login</title>
  <link rel="icon" type="icon" href="../Logos/busafe.ico">
  <link rel="stylesheet" href="../css/Style.css">
  <style>
    .login-container {
      max-width: 450px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.5);
      backdrop-filter: blur(6px);
    }

    .login-container h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text-clr);
    }

    .login-container p {
      text-align: center;
      color: var(--secondary-text-clr);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-clr);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.25);
      color: var(--text-clr);
      font-family: Poppins, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-clr);
      box-shadow: 0 0 0 3px rgba(16, 101, 156, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem 1.1rem;
      border-radius: 0.6rem;
      border: none;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgb(11, 67, 105);
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #10659c, #1375b7);
      box-shadow: 0 6px 18px rgb(11, 67, 105);
      transform: translateY(-2px) scale(1.02);
    }

    .login-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 4px 10px rgb(11, 67, 105);
    }

    .cadastro-link {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--secondary-text-clr);
    }

    .cadastro-link a {
      color: var(--accent-clr);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .cadastro-link a:hover {
      color: #1375b7;
      text-decoration: underline;
    }

    .error-message {
      background: rgba(239, 83, 80, 0.1);
      border: 1px solid #ef5350;
      color: #ef5350;
      padding: 1rem;
      border-radius: 0.6rem;
      margin-bottom: 1.5rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-clr);
      text-decoration: none;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      transition: background 0.3s ease;
    }

    .back-btn:hover {
      background: var(--hover-clr);
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-clr);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-container img {
      width: 150px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <a href="../index.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="m313-440 196 196q12 12 11.5 28T508-188q-12 11-28 11.5T452-188L188-452q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l264-264q11-11 27.5-11t28.5 11q12 12 12 28.5T508-715L313-520h447q17 0 28.5 11.5T800-480q0 17-11.5 28.5T760-440H313Z"/>
      </svg>
      Voltar
    </a>

    <div class="logo-container">
      <img src="../Logos/Logo_3.png" alt="BuSafe">
    </div>

    <h1>Entrar</h1>
    <p>Acesse sua conta BuSafe</p>

    <div class="error-message" id="errorMessage">
      CPF ou senha incorretos. Tente novamente.
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="login-btn">Entrar</button>
    </form>

    <div class="cadastro-link">
      Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a>
    </div>
  </div>

  <script>
    // Função para formatar CPF
    function formatarCPF(value) {
      value = value.replace(/\D/g, '');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      return value;
    }

    // Aplicar máscara ao CPF
    const cpfInput = document.getElementById('cpf');
    cpfInput.addEventListener('input', function(e) {
      e.target.value = formatarCPF(e.target.value);
    });

    // Submissão do formulário
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const cpf = document.getElementById('cpf').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // Remover formatação do CPF
      const cpfLimpo = cpf.replace(/[^\d]/g, '');
      
      const dados = {
        login: cpfLimpo,
        password: password
      };
      
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        });
        
        if (response.ok) {
          const data = await response.json();
          // Armazenar token
          localStorage.setItem('token', data.token);
          // Redirecionar para página principal
          window.location.href = '../index.html';
        } else {
          errorMessage.classList.add('show');
        }
      } catch (error) {
        console.error('Erro:', error);
        errorMessage.textContent = 'Erro ao processar login. Tente novamente.';
        errorMessage.classList.add('show');
      }
    });
  </script>
</body>
</html>
