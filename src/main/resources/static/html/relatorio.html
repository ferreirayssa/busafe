    <script>
      // Função para abrir o modal
function fazerLogout(event) {
    event.preventDefault(); // Impede o link de recarregar a página
    document.getElementById('modal-logout').style.display = 'flex';
}

// Função para fechar o modal
function fecharModalLogout() {
    document.getElementById('modal-logout').style.display = 'none';
}

// Função que limpa os dados e desloga de fato
function confirmarSair() {
    localStorage.clear(); // Apaga token, userId, etc.
    window.location.href = "/"; // Manda para a Landing Page na raiz
}

// Fechar modal se o usuário clicar fora da caixa branca
window.onclick = function(event) {
    const modal = document.getElementById('modal-logout');
    if (event.target == modal) {
        fecharModalLogout();
    }
}


  async function favoritarRotaNoBanco(codigoRota) {
    const token = localStorage.getItem('token');

    // 1. Verifica se existe um token (usuário está logado)
    if (!token) {
        showStatus("Erro: Você precisa estar logado para favoritar.");
        return;
    }

    try {
        showStatus("Salvando linha " + codigoRota + "...");

        // 2. Faz o POST para o endpoint que identifica o usuário pelo Token
        const response = await fetch('/api/users/rotas-fav', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ codigo: codigoRota })
        });

        if (response.ok) {
            showStatus("⭐ Rota " + codigoRota + " salva com sucesso!");
            
            // 3. ATUALIZA A SIDEBAR: Chama a função que reconstrói o menu "Linhas Frequentes"
            if (typeof carregarMeusFavoritos === "function") {
                carregarMeusFavoritos();
            }
        } else {
            // Caso o Java retorne erro (ex: rota já favoritada)
            const erroMsg = await response.text();
            showStatus(erroMsg || "Erro ao favoritar rota.");
        }
    } catch (err) {
        console.error("Erro na requisição:", err);
        showStatus("Erro de conexão com o servidor.");
    }
}

async function carregarMeusFavoritos() {
    const token = localStorage.getItem('token');
    const container = document.getElementById('lista-favoritos-sidebar');
    
    if (!token || !container) return;

    try {
        const response = await fetch('/api/users/rotas-fav', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.ok) {
            const favoritos = await response.json();
            
            // Limpa o conteúdo estático da div interna
            container.innerHTML = '';

            if (!favoritos || favoritos.length === 0) {
                container.innerHTML = '<span class="nav-item" style="font-size: 0.8rem; opacity: 0.5; padding-left: 2.6rem;">Nenhuma linha salva</span>';
                return;
            }

            // Injeta cada objeto Rota favorito
            favoritos.forEach(rota => {
                const link = document.createElement('a');
                link.href = "#";
                link.className = "nav-item";
                link.style.paddingLeft = "2.6rem"; 
                
                // Extraindo dados do objeto (Embedding)
                // Usamos os nomes exatos dos campos do seu Rota.java
                const numeroLinha = rota.linhaTranscol || rota.linhaMunicipal || "---";
                const nomeLinha = rota.nome || "";

                // Define o que aparece na tela (Texto, não o objeto)
                link.innerHTML = `<span>Linha ${numeroLinha} - ${nomeLinha}</span>`;
                
                link.onclick = (e) => {
                    e.preventDefault();
                    
                    // Verifica se estamos no mapa.html ou alert.html
                    const campoBusca = document.getElementById('linha') || document.getElementById('incidente-linha-busca');
                    
                    if (campoBusca) {
                        campoBusca.value = numeroLinha; // Atribui apenas o número (string)
                        
                        // Dispara o botão de busca se for o mapa
                        const btnGo = document.getElementById('go');
                        if (btnGo) btnGo.click();
                        
                        // Dispara evento de input para o autocomplete do alert.html notar a mudança
                        campoBusca.dispatchEvent(new Event('input'));
                    }
                    
                    // Fecha o menu lateral no mobile após clicar
                    if (window.innerWidth <= 768) {
                        const sidebar = document.getElementById('sidebar');
                        const overlay = document.getElementById('sidebar-overlay');
                        if(sidebar) sidebar.classList.remove('mobile-open');
                        if(overlay) overlay.classList.remove('show');
                    }
                };
                
                container.appendChild(link);
            });
        }
    } catch (err) {
        console.error("Erro ao carregar favoritos:", err);
    }
}

window.addEventListener('load', carregarMeusFavoritos);
  </script>
