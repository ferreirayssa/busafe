<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe — Mapa</title>
  <link rel="icon" href="../Logos/busafe.ico">
  <meta name="theme-color" content="#11121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BuSafe">
  <link rel="apple-touch-icon" href="../Logos/Logo_3.png">
  <link rel="stylesheet" href="../css/Style.css">
  
  <script src="../js/scripts.js" defer></script>
  <script src="../js/sidebarLoader.js" defer></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <main id="content">
    <div id="map"></div>
    <button id="star-favorite" class="map-floating-btn favorite-hidden" type="button" aria-label="Favoritar rota">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
        <path d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.314.16-.888-.282-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.612.636-.283.95l3.523 3.356-.83 4.73zm4.905-2.767-3.686 1.894.694-3.957a.565.565 0 0 0-.163-.505L1.71 6.745l4.052-.576a.525.525 0 0 0 .393-.288L8 2.223l1.845 3.658a.525.525 0 0 0 .393.288l4.052.575-2.906 2.77a.565.565 0 0 0-.163.506l.694 3.957-3.686-1.894a.503.503 0 0 0-.461 0z"/>
      </svg>
    </button>

    <div id="map-legend">
      <div class="legend-title">Legenda</div>
      
      <!-- Item: Parada de Ônibus -->
      <div class="legend-item">
        <div style="width: 18px; display: flex; justify-content: center; flex-shrink: 0;">
          <!-- SVG reduzido para 16x16 para combinar perfeitamente com a fonte 11px -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 32 32" style="filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.15));">
            <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#2b90d9" stroke-width="2.5" />
            <svg x="8" y="8" width="16" height="16" viewBox="0 0 16 16">
              <path fill="#2b90d9" d="M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1zM3.552 3.22A43 43 0 0 1 8 3c1.837 0 3.353.107 4.448.22a.5.5 0 0 0 .104-.994A44 44 0 0 0 8 2c-1.876 0-3.426.109-4.552.226a.5.5 0 1 0 .104.994M8 4c-1.876 0-3.426.109-4.552.226A.5.5 0 0 0 3 4.723v3.554a.5.5 0 0 0 .448.497C4.574 8.891 6.124 9 8 9s3.426-.109 4.552-.226A.5.5 0 0 0 13 8.277V4.723a.5.5 0 0 0-.448-.497A44 44 0 0 0 8 4m-3 7a1 1 0 1 0-2 0 1 1 0 0 0 2 0m8 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m-7 0a1 1 0 0 0 1 1h2a1 1 0 1 0 0-2H7a1 1 0 0 0-1 1"/>
            </svg>
          </svg>
        </div>
        <span>Parada de Ônibus</span>
      </div>

      <!-- Item: Rota -->
      <div class="legend-item">
        <div style="width: 18px; display: flex; justify-content: center; flex-shrink: 0;">
          <div class="legend-line" style="background:#812f9a;"></div>
        </div>
        <span>Rota Buscada</span>
      </div>

      <!-- Item: Sua Posição -->
      <div class="legend-item">
        <div style="width: 18px; display: flex; justify-content: center; flex-shrink: 0;">
          <div class="legend-dot" style="background:#1976d2;"></div>
        </div>
        <span>Sua posição</span>
      </div>
    </div>

    <div id="map-alert-banner" class="map-alert-banner hidden"></div>

    <button id="gps-center-btn" class="map-floating-btn" type="button" aria-label="Centralizar GPS no mapa">
      <span class="gps-compass-shell" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" fill="currentColor" class="bi bi-compass" viewBox="0 0 16 16">
          <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016m6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
          <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
        </svg>
      </span>
    </button>
  </main>

  <div id="toast-container"></div>

  <script>
  const GEOJSON_URL = "";
  const RELATOS_URL = "/relatos";

  // Agora buscando elementos pelo DOM (O #go e #clear só existirão depois que o sidebarLoader rodar, por isso lidaremos com os cliques no document ou depois)
  const statusEl = document.getElementById('status'); 
  const gpsCenterBtn = document.getElementById('gps-center-btn');
  const gpsDirectionArrow = document.getElementById('gps-direction-arrow');
  const alertBanner = document.getElementById('map-alert-banner');

  function showStatus(msg, ms = 2500) {
    const el = document.getElementById('status'); // Buscando dinamicamente pois pode ter sido injetado
    if(!el) return;
    el.textContent = msg;
    el.classList.add('show');
    if (ms) setTimeout(() => el.classList.remove('show'), ms);
  }

  function showAlertBanner(msg) {
    alertBanner.textContent = msg;
    alertBanner.classList.remove('hidden');
  }

  function hideAlertBanner() {
    alertBanner.textContent = '';
    alertBanner.classList.add('hidden');
  }

  const base = new ol.layer.Tile({ source: new ol.source.OSM() });

  const todasRotasSource = new ol.source.Vector({
    format: new ol.format.GeoJSON(),
    loader: async function(extent, resolution, projection, success, failure) {
      try {
        const url = GEOJSON_URL + "?v=" + Date.now();
        const token = localStorage.getItem('token');
        
        const response = await fetch(url, {
            method: 'GET',
            headers: { 'Authorization': token ? `Bearer ${token}` : '' }
        });
        
        if (!response.ok) throw new Error('Erro ao buscar GeoJSON: HTTP ' + response.status);

        const dadosRecebidos = await response.json();
        let geoJsonParaOMapa = dadosRecebidos;

        if (Array.isArray(dadosRecebidos)) {
            geoJsonParaOMapa = { type: "FeatureCollection", features: dadosRecebidos };
        } 
        else if (!geoJsonParaOMapa || !geoJsonParaOMapa.type) {
            console.error("A API não retornou um GeoJSON válido.");
            if (failure) failure();
            return;
        }

        const format = todasRotasSource.getFormat();
        const features = format.readFeatures(geoJsonParaOMapa, { featureProjection: projection });

        todasRotasSource.addFeatures(features);
        if (success) success(features);

      } catch (error) {
        console.error("Erro no loader customizado do mapa:", error);
        if (failure) failure(); 
      }
    }
  });

  const styleBySentido = feature => {
    const isVolta = /volta/i.test(String(feature.get('sentido') || ''));
    return new ol.style.Style({
      stroke: new ol.style.Stroke({
        color: isVolta ? '#d32f2f' : '#2e7d32',
        width: 3
      })
    });
  };

  const rotasLayer = new ol.layer.Vector({ source: todasRotasSource, style: styleBySentido });

  const resultadoSource = new ol.source.Vector({ features: [] });
  const resultadoLayer = new ol.layer.Vector({
    source: resultadoSource,
    style: new ol.style.Style({
      stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 })
    })
  });

  const relatoSource = new ol.source.Vector({ features: [] });
  const relatoLayer = new ol.layer.Vector({ source: relatoSource });

  const busSource = new ol.source.Vector({ features: [] });
  const busLayer = new ol.layer.Vector({ source: busSource });

  const userLocationSource = new ol.source.Vector({ features: [] });
  const userLocationLayer = new ol.layer.Vector({ source: userLocationSource });

  const pontosSource = new ol.source.Vector({ features: [] });
  const busIconSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#2b90d9" stroke-width="2.5" />
        <svg x="8" y="8" width="16" height="16" viewBox="0 0 16 16">
          <path fill="#2b90d9" d="M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1zM3.552 3.22A43 43 0 0 1 8 3c1.837 0 3.353.107 4.448.22a.5.5 0 0 0 .104-.994A44 44 0 0 0 8 2c-1.876 0-3.426.109-4.552.226a.5.5 0 1 0 .104.994M8 4c-1.876 0-3.426.109-4.552.226A.5.5 0 0 0 3 4.723v3.554a.5.5 0 0 0 .448.497C4.574 8.891 6.124 9 8 9s3.426-.109 4.552-.226A.5.5 0 0 0 13 8.277V4.723a.5.5 0 0 0-.448-.497A44 44 0 0 0 8 4m-3 7a1 1 0 1 0-2 0 1 1 0 0 0 2 0m8 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m-7 0a1 1 0 0 0 1 1h2a1 1 0 1 0 0-2H7a1 1 0 0 0-1 1"/>
        </svg>
      </svg>
    `;

  const pontosLayer = new ol.layer.Vector({ 
      source: pontosSource,
      visible: false, 
      style: new ol.style.Style({
        image: new ol.style.Icon({ src: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(busIconSvg), scale: 0.65, anchor: [0.5, 0.5] })
      })
    });

  const map = new ol.Map({
    target: 'map',
    layers: [base, rotasLayer, resultadoLayer, relatoLayer, busLayer, pontosLayer, userLocationLayer],
    view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 13 })
  });

  map.on('moveend', () => {
      const zoom = map.getView().getZoom();
      pontosLayer.setVisible(zoom > 13);
  });

  const popupEl = document.createElement('div');
  popupEl.id = 'incident-popup';
  popupEl.style.display = 'none';
  document.body.appendChild(popupEl);

  const popup = new ol.Overlay({
    element: popupEl,
    positioning: 'bottom-center',
    offset: [0, -18],
    stopEvent: false
  });
  map.addOverlay(popup);

  let userFeature = null;
  let currentUserCoord = null;
  let firstLocationFix = true;
  let linhaSelecionada = null;
  let relatosCache = null;

  const INCIDENT_ICON_DEFS = {
    assalto: { color: '#ef4444', viewBox: '0 0 16 16', path: 'M11 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8m5-4a5 5 0 1 1-10 0 5 5 0 0 1 10 0M9.438 11.944c.047.596.518 1.06 1.363 1.116v.44h.375v-.443c.875-.061 1.386-.529 1.386-1.207 0-.618-.39-.936-1.09-1.1l-.296-.07v-1.2c.376.043.614.248.671.532h.658c-.047-.575-.54-1.024-1.329-1.073V8.5h-.375v.45c-.747.073-1.255.522-1.255 1.158 0 .562.378.92 1.007 1.066l.248.061v1.272c-.384-.058-.639-.27-.696-.563h-.668zm1.36-1.354c-.369-.085-.569-.26-.569-.522 0-.294.216-.514.572-.578v1.1zm.432.746c.449.104.655.272.655.569 0 .339-.257.571-.709.614v-1.195zM1 0a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4.083q.088-.517.258-1H3a2 2 0 0 0-2-2V3a2 2 0 0 0 2-2h10a2 2 0 0 0 2 2v3.528c.38.34.717.728 1 1.154V1a1 1 0 0 0-1-1zM9.998 5.083 10 5a2 2 0 1 0-3.132 1.65 6 6 0 0 1 3.13-1.567', label: 'Assalto' },
    assedio: { color: '#f59e0b', viewBox: '0 0 16 16', path: 'M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z', label: 'Assédio' },
    violencia: { color: '#9333ea', viewBox: '0 0 16 16', path: 'M11 5a3 3 0 0 1-3 3 2.96 2.96 0 0 1-1.35-.32L3.52 4.55A3 3 0 1 1 11 5M2 13c0-2.45 2.3-4 6-4 .72 0 1.37.06 1.96.18L12.72 12A1.6 1.6 0 0 1 13 13c0 1-1 1-1 1H3s-1 0-1-1M1.3 1.05 14.95 14.7l-.9.9L.4 1.95l.9-.9z', label: 'Violência' },
    furto: { color: '#3b82f6', viewBox: '0 0 16 16', path: 'M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v1.384l7.614 2.03a1.5 1.5 0 0 0 .772 0L16 5.884V4.5A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5M0 12.5A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5V6.85L8.129 8.947a.5.5 0 0 1-.258 0L0 6.85z', label: 'Furto' },
    onibus_parado_quebrado: { color: '#64748b', viewBox: '0 0 16 16', path: 'M1 1a1 1 0 0 0-1 1v9a1.5 1.5 0 0 0 1 1.415V14.5a.5.5 0 0 0 1 0V13h10v1.5a.5.5 0 0 0 1 0v-2.085A1.5 1.5 0 0 0 14 11V2a1 1 0 0 0-1-1H1zm0 2h12v3H1V3zm1 5.5A1.5 1.5 0 1 1 2 11a1.5 1.5 0 0 1 0-2.5zM12 8.5A1.5 1.5 0 1 1 12 11a1.5 1.5 0 0 1 0-2.5z', label: 'Ônibus parado/quebrado' },
    quebrado: { color: '#64748b', viewBox: '0 0 16 16', path: 'M1 1a1 1 0 0 0-1 1v9a1.5 1.5 0 0 0 1 1.415V14.5a.5.5 0 0 0 1 0V13h10v1.5a.5.5 0 0 0 1 0v-2.085A1.5 1.5 0 0 0 14 11V2a1 1 0 0 0-1-1H1zm0 2h12v3H1V3zm1 5.5A1.5 1.5 0 1 1 2 11a1.5 1.5 0 0 1 0-2.5zM12 8.5A1.5 1.5 0 1 1 12 11a1.5 1.5 0 0 1 0-2.5z', label: 'Ônibus parado/quebrado' },
    outro: { color: '#45505d', viewBox: '0 0 16 16', path: 'M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm-.93-5.412h1.858v1.536H7.07v-1.536zm1.854-1.503H7.117l-.04-.23c-.075-.43.01-.842.29-1.197.21-.267.499-.473.884-.708.575-.35.746-.545.746-.875 0-.37-.287-.64-.782-.64-.562 0-.852.297-.907.82H5.64c.044-1.506 1.12-2.36 2.754-2.36 1.543 0 2.588.78 2.588 2.013 0 .757-.39 1.245-1.216 1.717-.472.27-.657.449-.75.695-.062.164-.074.333-.03.58z', label: 'Outro' },
    bus_monitorado: { color: '#0f766e', viewBox: '0 0 16 16', path: 'M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1v2zM3 11a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm8 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0z', label: 'Ônibus monitorado' }
  };

  const markerCache = new Map();
  const busMarkerCache = new Map();

  function svgToDataUrl(svg) { return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg); }

  function createMarkerSvg(def, { highlight = false, isBus = false } = {}) {
    const size = highlight ? 112 : 104;
    const center = size / 2;
    const haloRadius = highlight ? 44 : 40;
    const haloOpacityStrong = highlight ? 0.72 : 0.60;
    const haloOpacityMid = highlight ? 0.32 : 0.24;
    const bubbleRadius = isBus ? 16 : 15;
    const iconSize = isBus ? 20 : 18;

    return `
      <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="${def.color}" stop-opacity="${haloOpacityStrong}" />
            <stop offset="38%" stop-color="${def.color}" stop-opacity="${haloOpacityMid}" />
            <stop offset="72%" stop-color="${def.color}" stop-opacity="0.10" />
            <stop offset="100%" stop-color="${def.color}" stop-opacity="0" />
          </radialGradient>
        </defs>
        <circle cx="${center}" cy="${center}" r="${haloRadius}" fill="url(#g)" />
        <circle cx="${center}" cy="${center}" r="${bubbleRadius}" fill="${def.color}" stroke="#ffffff" stroke-width="3.2" />
        <svg x="${center - iconSize / 2}" y="${center - iconSize / 2}" width="${iconSize}" height="${iconSize}" viewBox="${def.viewBox}">
          <path d="${def.path}" fill="#ffffff"/>
        </svg>
      </svg>
    `;
  }

  function getMarkerStyle(type, { highlight = false, isBus = false, rotation = 0 } = {}) {
    const def = INCIDENT_ICON_DEFS[type] || INCIDENT_ICON_DEFS.outro;
    const cacheKey = `${type}-${highlight}-${isBus}`;
    const cache = isBus ? busMarkerCache : markerCache;
    if (!cache.has(cacheKey)) {
      cache.set(cacheKey, svgToDataUrl(createMarkerSvg(def, { highlight, isBus })));
    }
    return new ol.style.Style({
      image: new ol.style.Icon({ src: cache.get(cacheKey), imgSize: [highlight ? 112 : 104, highlight ? 112 : 104], anchor: [0.5, 0.5], rotateWithView: true, rotation }),
      zIndex: highlight ? 30 : (isBus ? 25 : 20)
    });
  }

  function createUserStyle() {
    return new ol.style.Style({ image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color: '#1976d2' }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) }) });
  }

  function formatarData(value) {
    if (!value) return 'Horário não informado';
    const d = new Date(value);
    return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  }

  function hexToRgbParts(hex) {
    const normalized = String(hex || '#45505d').replace('#', '');
    const value = parseInt(normalized.length === 3 ? normalized.split('').map(ch => ch + ch).join('') : normalized, 16);
    return Number.isNaN(value) ? '69, 80, 93' : `${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}`;
  }

  function popupThemeVars(type) {
    const def = INCIDENT_ICON_DEFS[type] || INCIDENT_ICON_DEFS.outro;
    return `--popup-accent:${def.color};--popup-accent-rgb:${hexToRgbParts(def.color)};`;
  }

  function popupIconMarkup(type) {
    const def = INCIDENT_ICON_DEFS[type] || INCIDENT_ICON_DEFS.outro;
    return `<span class="popup-type-icon" aria-hidden="true"><svg viewBox="${def.viewBox}"><path d="${def.path}"></path></svg></span>`;
  }

  function linhaDoRelato(relato) { return relato.linhaTranscol ?? relato.linhaMunicipal ?? null; }
  function isLinhaSelecionada(linha) { return linhaSelecionada != null && linha != null && String(linhaSelecionada).trim() === String(linha).trim(); }

  function atualizarDirecaoBotaoGps() {
    if (!currentUserCoord || !gpsDirectionArrow) return;
    const pixel = map.getPixelFromCoordinate(currentUserCoord);
    const size = map.getSize();
    if (!pixel || !size) return;
    const angle = Math.atan2(pixel[0] - size[0] / 2, -(pixel[1] - size[1] / 2)) * 180 / Math.PI;
    gpsDirectionArrow.style.transform = `rotate(${angle}deg)`;
  }

  function centerOnUser() {
    if (!currentUserCoord) { showStatus('Localização ainda não disponível.'); return; }
    map.getView().animate({ center: currentUserCoord, zoom: Math.max(map.getView().getZoom() || 15, 15), duration: 700 });
    popupEl.style.display = 'none';
    atualizarDirecaoBotaoGps();
  }

  function renderRelatos() {
    relatoSource.clear();
    relatosCache.forEach(relato => {
      if (relato.latitude == null || relato.longitude == null) return;
      const feat = new ol.Feature(new ol.geom.Point(ol.proj.fromLonLat([Number(relato.longitude), Number(relato.latitude)])));
      feat.setProperties({ featureType: 'relato', ...relato, linha: linhaDoRelato(relato) });
      feat.setStyle(getMarkerStyle(relato.tipo, { highlight: isLinhaSelecionada(linhaDoRelato(relato)) }));
      relatoSource.addFeature(feat);
    });
  }

  function atualizarBannerDaLinha() {
    if (linhaSelecionada == null) { hideAlertBanner(); return; }
    const relatosLinha = relatosCache.filter(r => isLinhaSelecionada(linhaDoRelato(r)));
    if (!relatosLinha.length) { hideAlertBanner(); return; }
    showAlertBanner(`Atenção: ${relatosLinha.length} denúncia${relatosLinha.length > 1 ? 's' : ''} na linha ${linhaSelecionada}.`);
  }

  function aplicarContextoDaLinha(codigo) {
    linhaSelecionada = codigo ? String(codigo).trim() : null;
    renderRelatos();
    atualizarBannerDaLinha();
  }

  async function carregarRelatos() {
    try {
        const token = localStorage.getItem('token');
        if (relatosCache && relatosCache.length > 0) {
            renderRelatos();
            atualizarBannerDaLinha();
            return; 
        }
        if (!token) return; 
        
        const resp = await fetch(RELATOS_URL + '?v=' + Date.now(), {
            method: 'GET',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        relatosCache = await resp.json();
        renderRelatos();
        atualizarBannerDaLinha();
    } catch (err) {
        console.error('Erro ao carregar relatos:', err);
    }
  }

  todasRotasSource.on('change', () => {
    if (todasRotasSource.getState() === 'loading') { showStatus('Carregando rotas…', 0); }
    else if (todasRotasSource.getState() === 'ready') {
      const el = document.getElementById('status');
      if(el) el.classList.remove('show');
      map.getView().fit(todasRotasSource.getExtent(), { padding: [40, 40, 40, 40], maxZoom: 15 });
    }
  });

  todasRotasSource.on('error', () => showStatus('Falha ao carregar rotas.', 5000));

  // --- Lógica de Interação com a Busca (Delegação de Eventos para os elementos injetados) ---
  document.addEventListener('click', async (e) => {
      // Evento de Limpar
      if(e.target && e.target.id === 'clear') {
          resultadoSource.clear();
          rotasLayer.setVisible(true);
          document.getElementById('linha').value = '';
          document.getElementById('star-favorite').classList.add('favorite-hidden');
          popupEl.style.display = 'none';
          aplicarContextoDaLinha(null);
          showStatus('Resultado limpo.');
      }
      
      // Evento de Buscar
      if(e.target && e.target.id === 'go') {
          const codigo = document.getElementById('linha').value.trim();
          if (!codigo) { showStatus('Informe o código da linha.'); return; }
          try {
            showStatus('Buscando linha ' + codigo + '…', 0);
            const resp = await fetch(`/api/rotas/buscar/${encodeURIComponent(codigo)}`);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const json = await resp.json();
            
            if (json.features?.length) {
              const feats = new ol.format.GeoJSON().readFeatures(json, { featureProjection: 'EPSG:3857' });
              resultadoSource.clear();
              resultadoSource.addFeatures(feats);
              rotasLayer.setVisible(false);
              const el = document.getElementById('status');
              if(el) el.classList.remove('show');
              map.getView().fit(resultadoSource.getExtent(), { padding: [40, 40, 40, 40], maxZoom: 15 });
              
              const starBtn = document.getElementById('star-favorite');
              starBtn.classList.remove('favorite-hidden');
              starBtn.onclick = () => favoritarRotaNoBanco(codigo);
              
              aplicarContextoDaLinha(codigo);
              showStatus('Linha ' + codigo + ' exibida!');
            } else {
              document.getElementById('star-favorite').classList.add('favorite-hidden');
              resultadoSource.clear();
              rotasLayer.setVisible(true);
              aplicarContextoDaLinha(null);
              showStatus('Linha não encontrada.');
            }
          } catch (err) { showStatus('Erro ao buscar linha.'); }
      }
  });

  document.addEventListener('keyup', e => { 
      if (e.key === 'Enter' && e.target.id === 'linha') {
          const btn = document.getElementById('go');
          if(btn) btn.click();
      }
  });

  function buscarLinha(codigo) {
    const input = document.getElementById('linha');
    if(input) input.value = codigo;
    const btn = document.getElementById('go');
    if(btn) btn.click();
  }

  // Lógica de Clique no Mapa e Popups
  map.on('click', async evt => {
    const feature = map.forEachFeatureAtPixel(evt.pixel, feat => feat, { layerFilter: layer => layer === relatoLayer || layer === busLayer || layer === pontosLayer });
    
    if (!feature) { popupEl.style.display = 'none'; popupEl.classList.remove('popup-visible'); return; }
    
    const kind = feature.get('featureType');
    
    if (kind === 'ponto') {
      const coord = ol.proj.toLonLat(evt.coordinate);
      const info = await buscarInfoPonto(coord[0], coord[1]);
      
      if (info) {
        let linhasInterativas = 'Nenhuma informação';
        if (info.linhas && info.linhas.length > 0) {
            linhasInterativas = info.linhas.map(l => `<a href="#" style="background: #eef2f5; color: #18679d; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 0.8rem; margin-right: 5px; display: inline-block; margin-bottom: 5px; text-decoration: none;" onclick="buscarLinha('${l}')">${l}</a>`).join('');
        }
                           
        popupEl.innerHTML = `
          <div class="popup-card" style="--popup-accent:#10659c;--popup-accent-rgb:16,101,156;">
            <div class="popup-header">
              <span class="popup-type-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
              </span>
              <div class="popup-heading">
                <span class="popup-eyebrow">Parada de Ônibus</span>
                <span class="popup-title">${info.nome || 'Ponto sem nome'}</span>
              </div>
            </div>
            <div class="popup-details">
              <div class="popup-row"><span>Linhas</span><strong>${linhasInterativas}</strong></div>
            </div>
          </div>
        `;
        popup.setPosition(evt.coordinate);
        popupEl.style.display = 'block';
        popupEl.classList.remove('popup-visible');
        void popupEl.offsetWidth;
        popupEl.classList.add('popup-visible');
      }
    } 
    else if (kind === 'onibus') {
      const tipo = feature.get('tipo');
      popupEl.innerHTML = `
        <div class="popup-card" style="${popupThemeVars('bus_monitorado')}">
          <div class="popup-header">
            ${popupIconMarkup('bus_monitorado')}
            <div class="popup-heading"><span class="popup-eyebrow">Monitoramento ativo</span><span class="popup-title">Ônibus monitorado</span></div>
          </div>
          <div class="popup-details">
            <div class="popup-row"><span>Linha</span><strong>${feature.get('linha') ?? '—'}</strong></div>
            <div class="popup-row"><span>Ocorrência</span><strong>${(INCIDENT_ICON_DEFS[tipo]?.label || tipo || '—')}</strong></div>
            <div class="popup-row"><span>Criado em</span><strong>${formatarData(feature.get('criadoEm'))}</strong></div>
          </div>
        </div>
      `;
      popup.setPosition(evt.coordinate);
      popupEl.style.display = 'block';
      popupEl.classList.remove('popup-visible');
      void popupEl.offsetWidth;
      popupEl.classList.add('popup-visible');
    } 
    else {
      const tipo = feature.get('tipo');
      popupEl.innerHTML = `
        <div class="popup-card" style="${popupThemeVars(tipo)}">
          <div class="popup-header">
            ${popupIconMarkup(tipo)}
            <div class="popup-heading"><span class="popup-eyebrow">Relato registrado</span><span class="popup-title">${INCIDENT_ICON_DEFS[tipo]?.label || 'Denúncia'}</span></div>
          </div>
          <div class="popup-details">
            <div class="popup-row"><span>Horário</span><strong>${formatarData(feature.get('dataRelato'))}</strong></div>
            <div class="popup-row"><span>Bairro</span><strong>${feature.get('bairro') || '—'}</strong></div>
            ${feature.get('linha') != null ? `<div class="popup-row"><span>Linha</span><strong>${feature.get('linha')}</strong></div>` : ''}
          </div>
          <div class="popup-desc"><span>Observações</span><strong>${feature.get('descricao') || 'Sem observações'}</strong></div>
        </div>
      `;
      popup.setPosition(evt.coordinate);
      popupEl.style.display = 'block';
      popupEl.classList.remove('popup-visible');
      void popupEl.offsetWidth;
      popupEl.classList.add('popup-visible');
    }
  });

  function atualizarUsuarioNoMapa(longitude, latitude) {
    currentUserCoord = ol.proj.fromLonLat([longitude, latitude]);
    if (!userFeature) {
      userFeature = new ol.Feature(new ol.geom.Point(currentUserCoord));
      userFeature.setStyle(createUserStyle());
      userLocationSource.addFeature(userFeature);
    } else { userFeature.setGeometry(new ol.geom.Point(currentUserCoord)); }
    if (firstLocationFix) {
      map.getView().animate({ center: currentUserCoord, zoom: 15, duration: 900 });
      firstLocationFix = false;
      showStatus('Localização encontrada!');
    }
    atualizarDirecaoBotaoGps();
  }

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      pos => atualizarUsuarioNoMapa(pos.coords.longitude, pos.coords.latitude),
      err => { console.error(err); showStatus('Localização não encontrada.', 3500); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  } else { showStatus('Geolocalização não suportada pelo navegador.', 4000); }

  if(gpsCenterBtn) gpsCenterBtn.addEventListener('click', centerOnUser);
  map.on('moveend', atualizarDirecaoBotaoGps);
  window.addEventListener('resize', () => {
      setTimeout(() => { map.updateSize(); atualizarDirecaoBotaoGps(); }, 320);
  });

  async function favoritarRotaNoBanco(codigoRota) {
    const token = localStorage.getItem('token');
    if (!token) { showStatus("Erro: Você precisa estar logado para favoritar."); return; }
    try {
        showStatus("Salvando linha " + codigoRota + "...");
        const response = await fetch('/api/users/rotas-fav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ codigo: codigoRota })
        });
        if (response.ok) {
            showStatus("⭐ Rota " + codigoRota + " salva com sucesso!");
            // Chama a função do sidebarLoader.js para atualizar a lista lateral na mesma hora!
            if (typeof carregarFavoritosSidebar === "function") carregarFavoritosSidebar();
        } else {
            const erroMsg = await response.text();
            showStatus(erroMsg || "Erro ao favoritar rota.");
        }
    } catch (err) { showStatus("Erro de conexão com o servidor."); }
  }

  async function buscarInfoPonto(lon, lat) {
    try {
        const response = await fetch(`/api/pontos/info?lat=${lat}&lon=${lon}`);
        if (!response.ok) return null;
        return await response.json();
    } catch (err) { return null; }
  }

  async function carregarPontosDoBanco() {
      try {
          const response = await fetch('/api/pontos/todos');
          if (response.ok) {
              const pontos = await response.json();
              const features = pontos.map(p => {
                  const coord = ol.proj.fromLonLat([p.localizacao.x, p.localizacao.y]);
                  const feature = new ol.Feature(new ol.geom.Point(coord));
                  feature.setProperties({ featureType: 'ponto', nome: p.nome });
                  return feature;
              });
              pontosSource.addFeatures(features);
          }
      } catch (e) { console.error("Erro ao carregar pontos do banco:", e); }
  }

  carregarRelatos();
  carregarPontosDoBanco(); 
  setInterval(carregarRelatos, 15000);

  </script>
</body>
