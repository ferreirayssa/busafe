<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar Incidente — BuSafe</title>
  <link rel="icon" href="../Logos/busafe.ico">
  <meta name="theme-color" content="#11121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BuSafe">

  <link rel="apple-touch-icon" href="../Logos/Logo_3.png">
  <link rel="stylesheet" href="../css/Style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  
  <script src="../js/scripts.js" defer></script>
  <script src="../js/sidebarLoader.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
</head>
<body>

  <div id="sidebar-container"></div>

  <!-- Formulário -->
  <div class="container">
    <h1>Reporte um Incidente</h1>
    <p class="page-subtitle">Ajude a comunidade com informações seguras e anônimas</p>

    <!-- Progresso -->
    <div class="progress-steps">
      <div class="progress-step active" id="step-1">
        <div class="step-circle">1</div>
        <span>Tipo</span>
      </div>
      <div class="step-connector" id="connector-1"></div>
      <div class="progress-step pending" id="step-2">
        <div class="step-circle">2</div>
        <span>Local</span>
      </div>
      <div class="step-connector" id="connector-2"></div>
      <div class="progress-step pending" id="step-3">
        <div class="step-circle">3</div>
        <span>Linha</span>
      </div>
    </div>

    <!-- Tipo -->
    <div class="section-title">Tipo de Incidente</div>
    <div class="incident-types">

      <div class="incident-card">
        <input type="radio" name="incident" id="assalto" value="assalto">
        <label for="assalto">
          <div class="incident-icon" style="color:#e53935;">
            <!-- bi-cash-coin -->
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-cash-coin" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M11 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8m5-4a5 5 0 1 1-10 0 5 5 0 0 1 10 0"/>
              <path d="M9.438 11.944c.047.596.518 1.06 1.363 1.116v.44h.375v-.443c.875-.061 1.386-.529 1.386-1.207 0-.618-.39-.936-1.09-1.1l-.296-.07v-1.2c.376.043.614.248.671.532h.658c-.047-.575-.54-1.024-1.329-1.073V8.5h-.375v.45c-.747.073-1.255.522-1.255 1.158 0 .562.378.92 1.007 1.066l.248.061v1.272c-.384-.058-.639-.27-.696-.563h-.668zm1.36-1.354c-.369-.085-.569-.26-.569-.522 0-.294.216-.514.572-.578v1.1zm.432.746c.449.104.655.272.655.569 0 .339-.257.571-.709.614v-1.195z"/>
              <path d="M1 0a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h4.083q.088-.517.258-1H3a2 2 0 0 0-2-2V3a2 2 0 0 0 2-2h10a2 2 0 0 0 2 2v3.528c.38.34.717.728 1 1.154V1a1 1 0 0 0-1-1z"/>
              <path d="M9.998 5.083 10 5a2 2 0 1 0-3.132 1.65 6 6 0 0 1 3.13-1.567"/>
            </svg>
          </div>
          <div>Assalto</div>
        </label>
      </div>

      <div class="incident-card">
        <input type="radio" name="incident" id="assedio" value="assedio">
        <label for="assedio">
          <div class="incident-icon" style="color:#ff9800;">
            <!-- bi-exclamation-circle -->
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
              <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057m1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/><path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0M7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
            </svg>
          </div>
          <div>Assédio</div>
        </label>
      </div>

      <div class="incident-card">
        <input type="radio" name="incident" id="violencia" value="violencia">
        <label for="violencia">
          <div class="incident-icon" style="color:#9c27b0;">
            <!-- bi-person-dash -->
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-person-fill-dash" viewBox="0 0 16 16">
              <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M11 12h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1m0-7a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/><path d="M2 13c0 1 1 1 1 1h5.256A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1 1.544-3.393Q8.844 9.002 8 9c-5 0-6 3-6 4"/>
            </svg>
          </div>
          <div>Violência</div>
        </label>
      </div>

      <div class="incident-card">
        <input type="radio" name="incident" id="furto" value="furto">
        <label for="furto">
          <div class="incident-icon" style="color:#2196f3;">
            <!-- bi-bag-x -->
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-briefcase-fill" viewBox="0 0 16 16">
              <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v1.384l7.614 2.03a1.5 1.5 0 0 0 .772 0L16 5.884V4.5A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5"/><path d="M0 12.5A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5V6.85L8.129 8.947a.5.5 0 0 1-.258 0L0 6.85z"/>
            </svg>
          </div>
          <div>Furto</div>
        </label>
      </div>

      <div class="incident-card">
        <input type="radio" name="incident" id="onibus-parado-quebrado" value="onibus_parado_quebrado">
        <label for="onibus-parado-quebrado">
          <div class="incident-icon" style="color:#ef6c00;">
            <!-- bi-bus-front -->
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-bus-front-fill" viewBox="0 0 16 16">
              <path d="M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1zM3.552 3.22A43 43 0 0 1 8 3c1.837 0 3.353.107 4.448.22a.5.5 0 0 0 .104-.994A44 44 0 0 0 8 2c-1.876 0-3.426.109-4.552.226a.5.5 0 1 0 .104.994M8 4c-1.876 0-3.426.109-4.552.226A.5.5 0 0 0 3 4.723v3.554a.5.5 0 0 0 .448.497C4.574 8.891 6.124 9 8 9s3.426-.109 4.552-.226A.5.5 0 0 0 13 8.277V4.723a.5.5 0 0 0-.448-.497A44 44 0 0 0 8 4m-3 7a1 1 0 1 0-2 0 1 1 0 0 0 2 0m8 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m-7 0a1 1 0 0 0 1 1h2a1 1 0 1 0 0-2H7a1 1 0 0 0-1 1"/>
            </svg>
          </div>
          <div>Ônibus Quebrado</div>
        </label>
      </div>

      <div class="incident-card">
        <input type="radio" name="incident" id="outro" value="outro">
        <label for="outro">
          <div class="incident-icon" style="color:#9e9e9e;">
            <!-- bi-question-circle -->
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
              <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"/>
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
            </svg>
          </div>
          <div>Outro</div>
        </label>
      </div>

    </div>

    <!-- Descrição -->
    <div class="section-title">Descrição do Incidente</div>
    <textarea placeholder="Descreva brevemente o que aconteceu..."></textarea>

    <!-- Mapa -->
    <div class="section-title">Ponto do Incidente</div>
    <div id="alert-map" style="height:280px;width:100%;border-radius:10px;margin-bottom:.75rem;border:1px solid rgba(255,255,255,.05);"></div>
    <input type="hidden" id="latitude"  name="latitude">
    <input type="hidden" id="longitude" name="longitude">

    <div class="location-wrapper" style="margin-bottom:.75rem;">
      <input type="text" id="bairro"    name="bairro"    placeholder="Bairro (automático)" readonly>
      <input type="text" id="municipio" name="municipio" placeholder="Município (automático)" readonly>
    </div>

    <!-- Linha (opcional) -->
    <div class="section-title">
      Linha do Ônibus
      <span style="font-weight:400;opacity:.6;font-size:.85em;text-transform:none;letter-spacing:0;">(opcional)</span>
    </div>
    <div class="location-wrapper">
      <input type="text"
             id="incidente-linha-busca"
             placeholder="Digite o número da linha (ex: 506)..."
             autocomplete="off">
      <div id="linha-resultados" class="search-results"></div>
      <input type="hidden" id="linha-numero-selecionada">
      <input type="hidden" id="linha-tipo-selecionada">

      <button class="location-btn" id="location-btn">
        <!-- bi-crosshair2 -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
          <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
        </svg>
        Minha localização
      </button>
    </div>

    <button class="submit-btn">
      <!-- bi-send -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send-fill" viewBox="0 0 16 16">
        <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"/>
      </svg>
      Enviar Denúncia
    </button>
  </div>
  <div id="toast-container"></div>

    <div id="modal-logout" class="modal-overlay" style="display: none;">
      <div class="modal-content">
          <div style="color: #10659c; margin-bottom: 15px; margin-top: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-patch-question-fill" viewBox="0 0 16 16">
              <path d="M5.933.87a2.89 2.89 0 0 1 4.134 0l.622.638.89-.011a2.89 2.89 0 0 1 2.924 2.924l-.01.89.636.622a2.89 2.89 0 0 1 0 4.134l-.637.622.011.89a2.89 2.89 0 0 1-2.924 2.924l-.89-.01-.622.636a2.89 2.89 0 0 1-4.134 0l-.622-.637-.89.011a2.89 2.89 0 0 1-2.924-2.924l.01-.89-.636-.622a2.89 2.89 0 0 1 0-4.134l.637-.622-.011-.89a2.89 2.89 0 0 1 2.924-2.924l.89.01zM7.002 11a1 1 0 1 0 2 0 1 1 0 0 0-2 0m1.602-2.027c.04-.534.198-.815.846-1.26.674-.475 1.05-1.09 1.05-1.986 0-1.325-.92-2.227-2.262-2.227-1.02 0-1.792.492-2.1 1.29A1.7 1.7 0 0 0 6 5.48c0 .393.203.64.545.64.272 0 .455-.147.564-.51.158-.592.525-.915 1.074-.915.61 0 1.03.446 1.03 1.084 0 .563-.208.885-.822 1.325-.619.433-.926.914-.926 1.64v.111c0 .428.208.745.585.745.336 0 .504-.24.554-.627"/>
            </svg>
          </div>
          <h3>Sair da conta?</h3>
          <p>Você precisará fazer login novamente para acessar seus favoritos e relatórios.</p>
          <div class="modal-buttons">
              <button class="btn-modal btn-modal-secondary" onclick="fecharModalLogout()">Cancelar</button>
              <button class="btn-modal btn-modal-primary" onclick="confirmarSair()">Sair agora</button>
          </div>
      </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => {
        t.style.animation = 'toastOut .4s forwards';
        setTimeout(() => t.remove(), 400);
      }, 3000);
    }

    const latInput          = document.getElementById('latitude');
    const lonInput          = document.getElementById('longitude');
    const submitBtn         = document.querySelector('.submit-btn');
    const locationBtn       = document.getElementById('location-btn');
    const buscaInput        = document.getElementById('incidente-linha-busca');
    const resultadosDiv     = document.getElementById('linha-resultados');
    const numeroSelecionado = document.getElementById('linha-numero-selecionada');
    const tipoSelecionado   = document.getElementById('linha-tipo-selecionada');
    let debounceTimer;

    /* progresso */
    function updateProgress() {
      const tipoOk  = !!document.querySelector('input[name="incident"]:checked');
      const localOk = !!(latInput.value && lonInput.value);
      const linhaOk = !!numeroSelecionado.value;

      setStep(1, tipoOk  ? 'done' : 'active');
      setStep(2, localOk ? 'done' : tipoOk  ? 'active' : 'pending');
      setStep(3, linhaOk ? 'done' : localOk ? 'active' : 'pending');

      document.getElementById('connector-1')?.classList.toggle('done', tipoOk);
      document.getElementById('connector-2')?.classList.toggle('done', localOk);
    }

    function setStep(n, state) {
      const el = document.getElementById('step-' + n);
      if (el) el.className = 'progress-step ' + state;
    }

    document.querySelectorAll('input[name="incident"]').forEach(r =>
      r.addEventListener('change', updateProgress)
    );

    /* mapa */
    const pinFeature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([-40.307,-20.318])) });
    pinFeature.setStyle(new ol.style.Style({
      image: new ol.style.Circle({ radius: 8, fill: new ol.style.Fill({ color: '#ef5350' }), stroke: new ol.style.Stroke({ color: '#fff', width: 2 }) })
    }));
    const map = new ol.Map({
      target: 'alert-map',
      layers: [
        new ol.layer.Tile({ source: new ol.source.OSM() }),
        new ol.layer.Vector({ source: new ol.source.Vector({ features: [pinFeature] }) })
      ],
      view: new ol.View({ center: ol.proj.fromLonLat([-40.307,-20.318]), zoom: 12 })
    });

    function updatePin(coords3857) {
      pinFeature.getGeometry().setCoordinates(coords3857);
      const [lon, lat] = ol.proj.toLonLat(coords3857);
      lonInput.value = lon;
      latInput.value = lat;
      obterEndereco(lat, lon);
      updateProgress();
    }

    async function obterEndereco(lat, lon) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1`);
        const d = await r.json();
        document.getElementById('municipio').value = d.address.city || d.address.town || 'Não encontrado';
        document.getElementById('bairro').value    = d.address.suburb || 'Não encontrado';
      } catch(e) { console.error(e); }
    }

    map.on('click', e => updatePin(e.coordinate));

    /* geolocalização */
    locationBtn.addEventListener('click', () => {
      if (!navigator.geolocation) { showToast('Geolocalização não suportada.','warning'); return; }
      locationBtn.disabled = true;
      locationBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="animation:spin 1s linear infinite"><path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/><path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/></svg> Buscando...`;
      navigator.geolocation.getCurrentPosition(
        pos => {
          const c = ol.proj.fromLonLat([pos.coords.longitude, pos.coords.latitude]);
          map.getView().animate({ center: c, zoom: 16, duration: 800 });
          updatePin(c);
          locationBtn.disabled = false;
          locationBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0a.5.5 0 0 1 .5.5v.518A7 7 0 0 1 14.982 7.5h.518a.5.5 0 0 1 0 1h-.518A7 7 0 0 1 8.5 14.982v.518a.5.5 0 0 1-1 0v-.518A7 7 0 0 1 1.018 8.5H.5a.5.5 0 0 1 0-1h.518A7 7 0 0 1 7.5.518V.5A.5.5 0 0 1 8 0zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zm0 1a5 5 0 1 1 0 10A5 5 0 0 1 8 3zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg> Minha localização`;
        },
        err => {
          showToast('Não foi possível obter sua localização.','error');
          console.error(err);
          locationBtn.disabled = false;
          locationBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0a.5.5 0 0 1 .5.5v.518A7 7 0 0 1 14.982 7.5h.518a.5.5 0 0 1 0 1h-.518A7 7 0 0 1 8.5 14.982v.518a.5.5 0 0 1-1 0v-.518A7 7 0 0 1 1.018 8.5H.5a.5.5 0 0 1 0-1h.518A7 7 0 0 1 7.5.518V.5A.5.5 0 0 1 8 0zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2zm0 1a5 5 0 1 1 0 10A5 5 0 0 1 8 3zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg> Minha localização`;
        }
      );
    });

    /* autocomplete */
    async function buscarLinhas(termo) {
      try {
        const r = await fetch(`/api/rotas/sugestoes?termo=${termo}`);
        exibirResultados(await r.json());
      } catch(e) { resultadosDiv.style.display = 'none'; }
    }

    function exibirResultados(linhas) {
      resultadosDiv.innerHTML = '';
      if (!linhas.length) { resultadosDiv.style.display = 'none'; return; }
      linhas.forEach(l => {
        const numero = l.linhaTranscol || l.linhaMunicipal;
        const tipo   = l.linhaTranscol ? 'TRANSCOL' : 'MUNICIPAL';
        const item   = document.createElement('div');
        item.className       = 'result-item';
        item.textContent     = `${numero} — ${l.nome}`;
        item.dataset.numero  = numero;
        item.dataset.tipo    = tipo;
        resultadosDiv.appendChild(item);
      });
      resultadosDiv.style.display = 'block';
    }

    buscaInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      numeroSelecionado.value = '';
      tipoSelecionado.value   = '';
      const t = buscaInput.value.trim();
      if (t.length < 1) { resultadosDiv.style.display = 'none'; return; }
      debounceTimer = setTimeout(() => buscarLinhas(t), 300);
    });

    resultadosDiv.addEventListener('click', e => {
      const item = e.target.closest('.result-item');
      if (item) {
        buscaInput.value = item.textContent;
        numeroSelecionado.value = item.dataset.numero;
        tipoSelecionado.value = item.dataset.tipo;
        resultadosDiv.style.display = 'none';
        updateProgress();
      }
    });

    document.addEventListener('click', e => {
      if (!buscaInput.contains(e.target) && !resultadosDiv.contains(e.target))
        resultadosDiv.style.display = 'none';
    });

  /* envio - CORRIGIDO COM TOKEN */
  submitBtn.addEventListener('click', async e => {
    e.preventDefault();
    const descricao     = document.querySelector('textarea').value.trim();
    const incidenteEl   = document.querySelector('input[name="incident"]:checked');
    const tipoIncidente = incidenteEl ? incidenteEl.value : '';
    const lat           = latInput.value;
    const lon           = lonInput.value;
    const bairro        = document.getElementById('bairro').value;
    const municipio     = document.getElementById('municipio').value;
    const numeroLinha   = numeroSelecionado.value;
    const tipoLinha     = tipoSelecionado.value;

    if (!lat || !lon || !descricao || !tipoIncidente) {
      showToast('Preencha: tipo, localização e descrição.','warning');
      return;
    }
    
    // ⬇️ VERIFICA SE ESTÁ LOGADO ⬇️
    const token = localStorage.getItem('token');
    if (!token) {
      showToast('Você precisa estar logado para reportar um incidente.','warning');
      return;
    }

      let usuarioId = localStorage.getItem('userId') || localStorage.getItem('id');
  
  // Se não tiver no localStorage, extrai do token JWT
  if (!usuarioId) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      usuarioId = payload.id || payload.userId || payload.sub;
      if (usuarioId) localStorage.setItem('userId', usuarioId);
    } catch(e) {
      console.error('Erro ao extrair ID do token:', e);
    }
  }

    let linhaTranscol = null, linhaMunicipal = null;
    if (numeroLinha && tipoLinha) {
      const n = parseInt(numeroLinha);
      if (tipoLinha === 'TRANSCOL')  linhaTranscol  = n;
      if (tipoLinha === 'MUNICIPAL') linhaMunicipal = n;
    }

    const dados = { 
      descricao, 
      tipo: tipoIncidente, 
      latitude: parseFloat(lat), 
      longitude: parseFloat(lon), 
      bairro, 
      municipio, 
      linhaTranscol, 
      linhaMunicipal,
      usuarioId: usuarioId  
    };

    // ⬇️ DESABILITA O BOTÃO PARA EVITAR DUPLO CLIQUE ⬇️
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    try {
      const resp = await fetch('/relatos', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token  // ⬅️ TOKEN AQUI!
        },
        body: JSON.stringify(dados)
      });
      
      if (resp.ok) {
        showToast('✅ Incidente reportado com sucesso!','success');

        // Limpa o formulário
        document.querySelector('textarea').value = '';
        buscaInput.value = '';
        numeroSelecionado.value = tipoSelecionado.value = '';
        document.getElementById('bairro').value = document.getElementById('municipio').value = '';
        latInput.value = lonInput.value = '';
        document.querySelectorAll('input[name="incident"]').forEach(r => r.checked = false);
        updateProgress();
        
        // Recarrega relatos no mapa se estiver na mesma sessão
        if (typeof carregarRelatos === 'function') {
          setTimeout(() => carregarRelatos(), 500);
        }
      } else {
        const erroTexto = await resp.text();
        console.error('Erro do servidor:', resp.status, erroTexto);
        
        if (resp.status === 403) {
          showToast('Sessão expirada. Faça login novamente.','error');
        } else if (resp.status === 401) {
          showToast('Autenticação necessária. Faça login.','error');
        } else {
          showToast('Erro ao reportar. ' + (erroTexto || 'Tente novamente.'),'error');
        }
      }
    } catch(err) {
      showToast('Erro ao se comunicar com o servidor.','error');
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send-fill" viewBox="0 0 16 16">
          <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"/>
        </svg>
        Enviar Denúncia
      `;
    }
  });
  });

  async function favoritarRotaNoBanco(codigoRota) {
    const token = localStorage.getItem('token');

    // 1. Verifica se existe um token (usuário está logado)
    if (!token) {
        showStatus("Erro: Você precisa estar logado para favoritar.");
        return;
    }

    try {
        showStatus("Salvando linha " + codigoRota + "...");

        // 2. Faz o POST para o endpoint que identifica o usuário pelo Token
        const response = await fetch('/api/users/rotas-fav', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ codigo: codigoRota })
        });

        if (response.ok) {
            showStatus("⭐ Rota " + codigoRota + " salva com sucesso!");
            
            // 3. ATUALIZA A SIDEBAR: Chama a função que reconstrói o menu "Linhas Frequentes"
            if (typeof carregarMeusFavoritos === "function") {
                carregarMeusFavoritos();
            }
        } else {
            // Caso o Java retorne erro (ex: rota já favoritada)
            const erroMsg = await response.text();
            showStatus(erroMsg || "Erro ao favoritar rota.");
        }
    } catch (err) {
        console.error("Erro na requisição:", err);
        showStatus("Erro de conexão com o servidor.");
    }
}

async function carregarMeusFavoritos() {
    const token = localStorage.getItem('token');
    const container = document.getElementById('lista-favoritos-sidebar');
    
    if (!token || !container) return;

    try {
        const response = await fetch('/api/users/rotas-fav', {
            method: 'GET',
            headers: { 'Authorization': 'Bearer ' + token }
        });

        if (response.ok) {
            const favoritos = await response.json();
            
            // Limpa o conteúdo estático da div interna
            container.innerHTML = '';

            if (!favoritos || favoritos.length === 0) {
                container.innerHTML = '<span class="nav-item" style="font-size: 0.8rem; opacity: 0.5; padding-left: 2.6rem;">Nenhuma linha salva</span>';
                return;
            }

            // Injeta cada objeto Rota favorito
            favoritos.forEach(rota => {
                const link = document.createElement('a');
                link.href = "#";
                link.className = "nav-item";
                link.style.paddingLeft = "2.6rem"; 
                
                // Extraindo dados do objeto (Embedding)
                // Usamos os nomes exatos dos campos do seu Rota.java
                const numeroLinha = rota.linhaTranscol || rota.linhaMunicipal || "---";
                const nomeLinha = rota.nome || "";

                // Define o que aparece na tela (Texto, não o objeto)
                link.innerHTML = `<span>Linha ${numeroLinha} - ${nomeLinha}</span>`;
                
                link.onclick = (e) => {
                    e.preventDefault();
                    
                    // Verifica se estamos no mapa.html ou alert.html
                    const campoBusca = document.getElementById('linha') || document.getElementById('incidente-linha-busca');
                    
                    if (campoBusca) {
                        campoBusca.value = numeroLinha; // Atribui apenas o número (string)
                        
                        // Dispara o botão de busca se for o mapa
                        const btnGo = document.getElementById('go');
                        if (btnGo) btnGo.click();
                        
                        // Dispara evento de input para o autocomplete do alert.html notar a mudança
                        campoBusca.dispatchEvent(new Event('input'));
                    }
                    
                    // Fecha o menu lateral no mobile após clicar
                    if (window.innerWidth <= 768) {
                        const sidebar = document.getElementById('sidebar');
                        const overlay = document.getElementById('sidebar-overlay');
                        if(sidebar) sidebar.classList.remove('mobile-open');
                        if(overlay) overlay.classList.remove('show');
                    }
                };
                
                container.appendChild(link);
            });
        }
    } catch (err) {
        console.error("Erro ao carregar favoritos:", err);
    }
}

window.addEventListener('load', carregarMeusFavoritos);

    document.getElementById('modal-logout').style.display = 'flex';
}

function fecharModalLogout() {
    document.getElementById('modal-logout').style.display = 'none';
}

// Função que limpa os dados e desloga de fato
function confirmarSair() {
    localStorage.clear(); // Apaga token, userId, etc.
    window.location.href = "/"; // Manda para a Landing Page na raiz
}

// Fechar modal se o usuário clicar fora da caixa branca
window.onclick = function(event) {
    const modal = document.getElementById('modal-logout');
    if (event.target == modal) {
        fecharModalLogout();
    }
}
