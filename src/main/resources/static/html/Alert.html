<script>
document.addEventListener('DOMContentLoaded', () => {
    const latInput = document.getElementById('latitude');
    const lonInput = document.getElementById('longitude');

    // --- 1. Inicializar o "Pin" (Marcador) ---
    const pinFeature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat([-40.307, -20.318]))
    });
    pinFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
            radius: 8,
            fill: new ol.style.Fill({ color: '#ef5350' }),
            stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        })
    }));
    const pinLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [pinFeature] })
    });

    // --- 2. Inicializar o Mapa ---
    const map = new ol.Map({
        target: 'alert-map',
        layers: [
            new ol.layer.Tile({ source: new ol.source.OSM() }),
            pinLayer
        ],
        view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 12 })
    });

    // --- 3. Função para atualizar o Pin e os Inputs ---
    function updatePinLocation(coords_3857) { // Coordenadas no formato do mapa
        // Move o pin
        pinFeature.getGeometry().setCoordinates(coords_3857);
        
        // Converte para Lat/Lon (formato GPS)
        const coords_4326 = ol.proj.toLonLat(coords_3857);
        
        // Salva nos inputs ocultos
        lonInput.value = coords_4326[0];
        latInput.value = coords_4326[1];
        
        console.log('Localização salva:', latInput.value, lonInput.value);
    }

    // --- 4. Clicar no Mapa para mover o Pin ---
    map.on('click', (e) => {
        updatePinLocation(e.coordinate);
    });

    // --- 5. Lógica do Botão "Usar minha Localização" ---
    const locationBtn = document.querySelector('.location-btn');
    locationBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            alert('Geolocalização não é suportada pelo seu navegador.');
            return;
        }

        locationBtn.disabled = true; // Desativa o botão enquanto busca
        locationBtn.textContent = 'Buscando...';

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const coords_4326 = [pos.coords.longitude, pos.coords.latitude];
                const coords_3857 = ol.proj.fromLonLat(coords_4326);

                // Centraliza o mapa e atualiza o pin
                map.getView().animate({ center: coords_3857, zoom: 16, duration: 1000 });
                updatePinLocation(coords_3857);
                
                locationBtn.disabled = false;
                locationBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20" fill="white"><path d="M352 348.4C416.1 333.9 464 276.5 464 208C464 128.5 399.5 64 320 64C240.5 64 176 128.5 176 208C176 276.5 223.9 333.9 288 348.4L288 544C288 561.7 302.3 576 320 576C337.7 576 352 561.7 352 544L352 348.4zM328 160C297.1 160 272 185.1 272 216C272 229.3 261.3 240 248 240C234.7 240 224 229.3 224 216C224 158.6 270.6 112 328 112C341.3 112 352 122.7 352 136C352 149.3 341.3 160 328 160z"/></svg>';
            },
            (err) => {
                alert('Não foi possível obter sua localização.');
                console.error(err);
                locationBtn.disabled = false;
                locationBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="20" height="20" fill="white"><path d="M352 348.4C416.1 333.9 464 276.5 464 208C464 128.5 399.5 64 320 64C240.5 64 176 128.5 176 208C176 276.5 223.9 333.9 288 348.4L288 544C288 561.7 302.3 576 320 576C337.7 576 352 561.7 352 544L352 348.4zM328 160C297.1 160 272 185.1 272 216C272 229.3 261.3 240 248 240C234.7 240 224 229.3 224 216C224 158.6 270.6 112 328 112C341.3 112 352 122.7 352 136C352 149.3 341.3 160 328 160z"/></svg>';
            }
        );
    });
});
</script>
