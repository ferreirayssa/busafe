<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Busafe — Rotas por Linha</title>

  <!-- OpenLayers bundle (global "ol") -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>

  <style>
    html, body { margin:0; height:100%; }
    #map { width:100%; height:100vh; }
    #toolbar {
      position: fixed; z-index: 1000; top: 12px; left: 12px;
      background: rgba(255,255,255,.9); backdrop-filter: blur(4px);
      border-radius: 14px; padding: 8px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .legend {
      position: fixed; right: 12px; bottom: 12px; z-index: 1000;
      background: rgba(255,255,255,.9); padding: 10px 12px; border-radius: 12px;
      font: 13px system-ui, -apple-system, Segoe UI, Roboto, Arial;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    .key { display:flex; align-items:center; gap:8px; margin:4px 0; }
    .swatch { width:14px; height:4px; border-radius: 2px; background:#999; }
    .swatch.p { background:#812f9a; }
    #status {
      position: fixed; left: 50%; transform: translateX(-50%);
      top: 12px; z-index: 1100;
      background: #222; color: #fff; padding: 6px 10px; border-radius: 10px;
      font: 13px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      display: none;
    }
    label { display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>
  <div id="status"></div>

  <div id="toolbar">
    <input id="linha" placeholder="Ex: 500 (Transcol) ou 010 (Municipal)" style="width:240px">

    <button id="go">Buscar</button>
    <button id="clear">Limpar</button>
    <button id="fit">Enquadrar</button>

    <!-- <label style="margin-left:8px">
    <input type="checkbox" id="toggleKml" checked> Exibir rotas
    </label> -->
  </div>

  <div id="map"></div>

  <div class="legend">
    <div class="key"><span class="swatch p"></span> Roxo: Rota</div>
  </div>

  <script>
    const KML_URL = "/rotas/rotas-transcol.kml"; // garanta que responde 200
    const statusEl = document.getElementById('status');
    const showStatus = (msg, ms=2500) => {
      statusEl.textContent = msg; statusEl.style.display = 'block';
      if (ms) setTimeout(()=> statusEl.style.display='none', ms);
    };

    // === Base OSM ===
    const base = new ol.layer.Tile({ source: new ol.source.OSM() });

    // === Camada KML (todas as rotas) — opcional ===
    const kmlSource = new ol.source.Vector({
      url: KML_URL + "?v=" + Date.now(),
      format: new ol.format.KML({ extractStyles: false })
    });
    const styleBySentido = (feature) => {
      const name = String(feature.get('name') || '');
      const desc = String(feature.get('description') || '');
      const isVolta = /volta/i.test(name) || /volta/i.test(desc);
      return new ol.style.Style({
        stroke: new ol.style.Stroke({ color: isVolta ? '#d32f2f' : '#2e7d32', width: 3 })
      });
    };
    const rotasKmlLayer = new ol.layer.Vector({ source: kmlSource, style: styleBySentido });

    // Eventos do KML (status)
    kmlSource.on('change', () => {
      if (kmlSource.getState() === 'loading') {
        showStatus('Carregando KML…', 0);
      } else if (kmlSource.getState() === 'ready') {
        statusEl.style.display = 'none';
      }
    });
    kmlSource.on('error', () => showStatus('Falha ao carregar KML. Verifique ' + KML_URL, 5000));

    // === Camada GeoJSON dinâmica (resultado da busca por linha) ===
    const resultadoSource = new ol.source.Vector({ features: [] });
    const resultadoLayer  = new ol.layer.Vector({
      source: resultadoSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 }) // roxo
      })
    });

    // === Mapa ===
    const map = new ol.Map({
      target: 'map',
      layers: [base, rotasKmlLayer, resultadoLayer],
      view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 12 })
    });

    // === UI handlers ===
    // document.getElementById('toggleKml').onchange = (e) => {
    //  rotasKmlLayer.setVisible(e.target.checked);
    //};

    document.getElementById('fit').onclick = () => {
      const src = resultadoSource.getFeatures().length ? resultadoSource : kmlSource;
      if (src.getFeatures().length) {
        map.getView().fit(src.getExtent(), { padding: [40,40,40,40], maxZoom: 15 });
      }
    };

    document.getElementById('clear').onclick = () => {
      resultadoSource.clear();
      showStatus('Resultado limpo.');
    };

document.getElementById('go').onclick = async () => {
  const codigo = document.getElementById('linha').value.trim();
  if (!codigo) { showStatus('Informe o código da linha.'); return; }

  let url = `/api/rotas/buscar/${encodeURIComponent(codigo)}`;

  try {
    showStatus('Buscando linha ' + codigo + '…', 0);

    // Fazendo o fetch da API
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    // Obtendo o GeoJSON da resposta
    const json = await resp.json();
    console.log(json);  // Para depuração

    // Verificando se a resposta tem a estrutura correta
    if (json.features && json.features.length > 0) {
      const format = new ol.format.GeoJSON();
      const feats = format.readFeatures(json, { featureProjection: 'EPSG:3857' });

      // Limpando a camada de resultados anteriores
      resultadoSource.clear();
      resultadoSource.addFeatures(feats);

      statusEl.style.display = 'none';
      if (feats.length) {
        map.getView().fit(resultadoSource.getExtent(), { padding: [40, 40, 40, 40], maxZoom: 15 });
        showStatus('Linha exibida no mapa!');
      } else {
        showStatus('Nenhuma geometria retornada para ' + codigo, 3000);
      }
    } else {
      resultadoSource.clear();
      showStatus('Nenhuma rota encontrada para o código informado.', 3000);
    }
  } catch (err) {
    console.error(err);
    showStatus('Erro ao buscar linha. Verifique a API: ' + url, 5000);
  }
};

// === Localização do usuário ===
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const coords = [pos.coords.longitude, pos.coords.latitude];
      const olCoords = ol.proj.fromLonLat(coords);

      // Centraliza o mapa
      map.getView().animate({ center: olCoords, zoom: 15, duration: 1000 });

      // Marca a posição no mapa
      const userFeature = new ol.Feature(new ol.geom.Point(olCoords));
      userFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: '#1976d2' }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        })
      }));

      const userLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [userFeature] })
      });
      map.addLayer(userLayer);

      showStatus('Sua localização foi encontrada!');
    },
    (err) => {
      console.error(err);
      showStatus('Não foi possível obter sua localização.');
    }
  );
} else {
  showStatus('Geolocalização não é suportada neste navegador.');
}


  </script>
</body>
</html>
