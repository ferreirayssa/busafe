<!DOCTYPE html>
<html lang="PT-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuSafe - 404</title>
  <link rel="icon" type="image/x-icon" href="../Logos/busafe.ico">
  <style>
    :root {
      --text-clr: #333333;
      --secondary-text-clr: #666666;
      --accent-clr: #10659c;
      --bg-dark: #0f1016;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      /* Mesma imagem de fundo que você usa no login */
      background: url('../prototipo/osm.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Poppins, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7); /* Fundo um pouco mais escuro para dar destaque ao erro */
      z-index: 1;
    }

    .error-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 450px;
      padding: 3rem 2.5rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.98));
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--accent-clr);
      margin: 0;
      line-height: 1;
      text-shadow: 0 4px 12px rgba(16, 101, 156, 0.2);
    }

    .error-title {
      font-size: 1.5rem;
      color: var(--text-clr);
      margin: 1rem 0 0.5rem 0;
    }

    .error-msg {
      color: var(--secondary-text-clr);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .back-btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 0.6rem;
      background: linear-gradient(90deg, #10659c, #1375b7);
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(16, 101, 156, 0.3);
    }

    .back-btn:hover {
      background: linear-gradient(90deg, #1375b7, #1585cf);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(16, 101, 156, 0.4);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  
  <div class="error-container">
    <h1 class="error-code">Ops..</h1>
    <h2 class="error-title">Tela não encontrada</h2>
    <p class="error-msg">A página que você está procurando pode ter sido removida, teve seu nome alterado ou está temporariamente indisponível.</p>
    
    <a href="/" class="back-btn">Voltar para o Início</a>
  </div>
</body>
</html>
