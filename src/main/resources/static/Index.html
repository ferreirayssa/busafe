    <script>
    const GEOJSON_URL = "/rotas/geojson"; // Endpoint que retorna todas as rotas em GeoJSON
    const statusEl = document.getElementById('status');
    const showStatus = (msg, ms=2500) => {
      statusEl.textContent = msg; statusEl.classList.add('show');
      if (ms) setTimeout(()=> statusEl.style.display='none', ms);
    };

    // === Base OSM ===
    const base = new ol.layer.Tile({ source: new ol.source.OSM() });

    // === Camada KML (todas as rotas) — opcional ===
    const todasRotasSource = new ol.source.Vector({
      url: GEOJSON_URL + "?v=" + Date.now(),
      format: new ol.format.GeoJSON()
    });
    const styleBySentido = (feature) => {
      const sentido = String(feature.get('sentido') || '');
      const isVolta = /volta/i.test(sentido);
      return new ol.style.Style({
        stroke: new ol.style.Stroke({ color: isVolta ? '#d32f2f' : '#2e7d32', width: 3 })
      });
    };
    const rotasLayer = new ol.layer.Vector({ source: todasRotasSource, style: styleBySentido });

    // Eventos do KML (status)
    todasRotasSource.on('change', () => {
      if (todasRotasSource.getState() === 'loading') {
        showStatus('Carregando rotas…', 0);
      } else if (todasRotasSource.getState() === 'ready') {
        statusEl.style.display = 'none';
        map.getView().fit(todasRotasSource.getExtent(), { padding: [40,40,40,40], maxZoom: 15 });
      }
    });
    todasRotasSource.on('error', () => showStatus('Falha ao carregar rotas. Verifique ' + GEOJSON_URL, 5000));

    // === Camada GeoJSON dinâmica (resultado da busca por linha) ===
    const resultadoSource = new ol.source.Vector({ features: [] });
    const resultadoLayer  = new ol.layer.Vector({
      source: resultadoSource,
      style: new ol.style.Style({
        stroke: new ol.style.Stroke({ color: '#812f9a', width: 4 }) // roxo
      })
    });

    // === Mapa ===
    const map = new ol.Map({
      target: 'map',
      layers: [base, rotasLayer, resultadoLayer],
      view: new ol.View({ center: ol.proj.fromLonLat([-40.307, -20.318]), zoom: 12 })
    });

    // === UI handlers ===
    // document.getElementById('toggleKml').onchange = (e) => {
    //  rotasKmlLayer.setVisible(e.target.checked);
    //};

    document.getElementById('clear').onclick = () => {
      resultadoSource.clear();
      document.getElementById('linha').value = '';
      showStatus('Resultado limpo.');
    };

document.getElementById('go').onclick = async () => {
  const codigo = document.getElementById('linha').value.trim();
  if (!codigo) { showStatus('Informe o código da linha.'); return; }
  
  let url = `/api/rotas/buscar/${encodeURIComponent(codigo)}`;

  try {
    showStatus('Buscando linha ' + codigo + '…', 0);

    // Fazendo o fetch da API
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    // Obtendo o GeoJSON da resposta
    const json = await resp.json();

    // Verificando se a resposta tem a estrutura correta
    if (json.features && json.features.length > 0) {
      const format = new ol.format.GeoJSON();
      const feats = format.readFeatures(json, { featureProjection: 'EPSG:3857' });

      // Limpando a camada de resultados anteriores
      resultadoSource.clear();
      resultadoSource.addFeatures(feats);
      rotasLayer.setVisible(false); // Esconde as rotas gerais

      statusEl.style.display = 'none';
      if (feats.length) {
        map.getView().fit(resultadoSource.getExtent(), { padding: [40, 40, 40, 40], maxZoom: 15 });
        showStatus('Linha exibida no mapa!');
      } else {
        showStatus('Nenhuma geometria retornada para ' + codigo, 3000);
      }
    } else {
      resultadoSource.clear();
      rotasLayer.setVisible(true);
      showStatus('Nenhuma rota encontrada para o código informado.', 3000);
    }
  } catch (err) {
    console.error(err);
    showStatus('Erro ao buscar linha. Verifique a API: ' + url, 5000);
  }
};

document.getElementById('linha').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') document.getElementById('go').click();
});


// === Localização do usuário ===
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const coords = [pos.coords.longitude, pos.coords.latitude];
      const olCoords = ol.proj.fromLonLat(coords);

      // Centraliza o mapa
      map.getView().animate({ center: olCoords, zoom: 15, duration: 1000 });

      // Marca a posição no mapa
      const userFeature = new ol.Feature(new ol.geom.Point(olCoords));
      userFeature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 8,
          fill: new ol.style.Fill({ color: '#1976d2' }),
          stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
        })
      }));

      const userLayer = new ol.layer.Vector({
        source: new ol.source.Vector({ features: [userFeature] })
      });
      map.addLayer(userLayer);

      showStatus('Localização encontrada!');
    },
    (err) => {
      console.error(err);
      showStatus('Localização não encontrada.');
    }
  );
} else {
  showStatus('Geolocalização não é suportada neste navegador.');
}

// === mostrar rotas frequentes no menu ===
document.querySelectorAll('.sub-menu a').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault(); // Impede o link de navegar

    // Pega o número da linha (ex: "505")
    const nomeLinha = link.textContent.trim();

    // Coloca o número no campo de busca
    document.getElementById('linha').value = nomeLinha;

    // "Clica" no botão Buscar
    document.getElementById('go').click();

    // Fecha o submenu
    closeAllSubMenus();
  });
});
